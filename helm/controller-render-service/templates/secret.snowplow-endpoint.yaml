{{- if .Values.snowplowEndpoint.enabled }}
# External Endpoint for controller-render-service. snowplow's RESTAction `endpointRef` resolves an
# Endpoint from a Secret keyed by `server-url` (the only REQUIRED field; token/ca/etc. are optional
# and unset here — the service is cluster-internal, plain HTTP, and reads nothing from the cluster).
# Consumed by the portal's controller-render-draft RESTAction.
#
# The URL is built from the SAME helper the Service uses, so a fullnameOverride or a changed
# service.port moves both together. That is the whole point: the failure this prevents is a Secret
# still pointing at the old name after someone renames the Service.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.snowplowEndpoint.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
  labels:
    {{- include "controller-render-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  server-url: http://{{ include "controller-render-service.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}
{{- end }}

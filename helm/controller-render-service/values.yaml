# Default values for controller-render-service.
#
# These defaults are CORRECT FOR COMPOSITION USE as they stand: installing this chart as a Krateo
# component needs no componentValues at all. That is the point of the chart existing — see the note
# in Chart.yaml.

# global.imageRegistry, when set, overrides the registry HOST of the image below (the repository
# path is preserved) — for mirror / air-gapped installs.
global:
  imageRegistry: ""

replicaCount: 1

# The oasgen-provider image: this chart runs its `oasgen-render` entrypoint rather than the
# controller. Same image, same tag, different command — so the renderer can never drift from the
# generator whose output it previews.
image:
  registry: ghcr.io
  repository: krateo-platformops/oasgen-provider
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Port the binary listens on (passed as --addr). Matches service.port and
# blueprint-render-service, so the two renderers are identical on the wire.
containerPort: 8080

service:
  type: ClusterIP
  port: 8080

podAnnotations: {}

# Left as {} to match the sub-deployment this chart replaces. See Chart.yaml: hardening is a
# separate change.
podSecurityContext: {}
securityContext: {}

# maxBodyMiB is the largest POST /render body this service accepts, in MiB. IT IS THE ONLY KNOB:
# the container's memory limit is DERIVED from it below, because the two are physically coupled and
# setting them independently is how a service ends up accepting bodies it cannot render (#628).
#
# THE COUPLING IS MEASURED, not guessed. Parsing and rendering a document allocates ~97x its size and
# holds ~29x of it live at peak:
#
#   input      allocated   live heap
#     35 KiB     9.6 MiB     8.3 MiB
#    349 KiB      37 MiB      15 MiB
#    1.3 MiB     124 MiB      46 MiB
#    3.1 MiB     300 MiB      90 MiB
#
# Note the ratio is NOT constant -- 242x at 35 KiB falling to 29x at 3.1 MiB -- so the derivation
# below is a BASELINE PLUS A MARGINAL RATE rather than a single multiplier. A flat `cap x 29` would
# derive a limit the Go runtime cannot start in at small caps.
maxBodyMiB: 4

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    # memory is DERIVED from maxBodyMiB (see templates/deployment.yaml) and is deliberately absent
    # here. Set memoryLimitOverride below only if you have measured your own workload and mean to
    # depart from the coupling -- the derivation exists so a closed consumer values schema cannot
    # express the broken pair at all, and an override reopens that door.
    #
    # At the default maxBodyMiB: 4 the derived limit is 512Mi, exactly what this chart shipped
    # before the knob existed, so upgrading changes nothing for anyone who does not raise the cap.

# memoryLimitOverride, when set, replaces the derived memory limit entirely. Empty means derive.
memoryLimitOverride: ""

nodeSelector: {}
affinity: {}
tolerations: []

# Extra environment variables, as a flat name/value map.
env: {}

# The render Service's address, published as a Secret so consumers read it from ONE place instead
# of spelling the same host out in two charts. snowplow's RESTAction `endpointRef` resolves an
# Endpoint from a Secret keyed by `server-url`.
#
# Default ON, like blueprint-render-service: this is the Krateo controller renderer, and the
# endpoint Secret the portal RESTActions resolve (controller-render-draft) is always needed.
# Deploying as a Krateo Composition component therefore needs no extra componentValues.
snowplowEndpoint:
  enabled: true
  name: controller-render-endpoint

# Default values for oasgen-provider.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

global:
  imageRegistry: ""
image:
  registry: ghcr.io
  repository: krateo-platformops/oasgen-provider
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: "oasgen-provider"
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# livenessProbe:
#   httpGet:
#     path: /
#     port: http
# readinessProbe:
#   httpGet:
#     path: /
#     port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - emptyDir: {}
    name: tmp-dir

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - mountPath: /tmp
    name: tmp-dir

nodeSelector: {}

tolerations: []

affinity: {}

rdc:
  # #379: the hosts a CREDENTIALED request may reach, beyond the ones the OAS document itself names.
  #
  # EMPTY IS THE NO-OP AND THE DEFAULT. An empty list means "no endpoint override is permitted; use the
  # hosts the document names" -- which is where requests already go, so an existing install needs no
  # change and is still fixed. Requiring a value would turn every single-host provider into a config
  # error on upgrade for a capability it does not use.
  #
  # Entries are host[:port], optionally prefixed `http://` (no prefix permits https ONLY -- cleartext
  # has to be asked for), and may use a single leading `*.` wildcard, which matches one or more leading
  # labels and NOT the bare suffix. A bare `*` is rejected at startup; see allowAnyHost below.
  #
  # A PATH IS REFUSED AT STARTUP, with a message saying what to write instead. A path plays no part in
  # matching a host, so pasting a document's `servers[0]` verbatim -- `https://ghe.corp.example.com/api/v3`
  # -- does not belong here; write the host alone. The refusal exists because `example.com/*` used to be
  # accepted as an EXACT entry for example.com: the path was discarded before the `*` checks ran, so the
  # `*` was never seen, and sub.example.com was then refused while this file visibly contained something
  # that looks like it should match (#402). The document's own server URLs are unaffected -- those
  # legitimately carry a path and are read from the document, not from here.
  #
  #   endpointAllowlist:
  #     - ghe.corp.example.com
  #     - ghe.corp.example.com:8443
  #     - "*.ghe.corp.example.com"
  #     - http://legacy.internal.example.com
  #
  # Loopback, link-local, multicast and the unspecified address are refused regardless of this list, and
  # that cannot be overridden from values -- those are the SSRF targets. RFC1918 is deliberately
  # reachable, because an on-prem GHES is routinely private; the control for private space is naming the
  # host here.
  #
  # A DEDICATED KEY rather than rdc.env, deliberately. These would also travel through
  # REST_CONTROLLER_ENDPOINT_ALLOWLIST in rdc.env, and for a security control that is the wrong channel:
  # a misspelled key in a free-form env map silently does nothing, so the operator believes the
  # allowlist is set when it is not. The schema rejects a typo here.
  endpointAllowlist: []

  # Disable endpoint matching entirely. The unconditional refusals above still apply.
  #
  # Its own key rather than a `*` entry in the list, so "permit any host" appears in a values diff
  # instead of hiding as punctuation. The controller also logs it loudly once at startup.
  allowAnyHost: false

  # Node-local OTLP endpoint for the C8 audit trail (#253).
  #
  # OFF by default, deliberately. When enabled, the generated controllers get an explicit env block
  # setting OTEL_EXPORTER_OTLP_ENDPOINT to http://$(HOST_IP):<port>, with HOST_IP from
  # status.hostIP -- which is the only way to reach a node-local collector, because the OTLP
  # collector service is headless and has no cluster IP to address.
  #
  # It is gated because an `env:` entry WINS over an `envFrom` one of the same name: with this on,
  # an OTEL_EXPORTER_OTLP_ENDPOINT supplied through rdc.env is silently overridden. Leaving it off
  # means an install that sets its own endpoint keeps it.
  #
  # Setting this alone does not start the audit trail: the controller also needs
  # OTEL_LOGS_ENABLED=true, which travels through rdc.env.
  otel:
    nodeLocalEndpoint: false
    nodeLocalPort: 4318
  image:
    registry: ghcr.io
    repository: krateo-platformops/rest-dynamic-controller
    pullPolicy: IfNotPresent
    # The RDC tag FOLLOWS THE CHART'S appVersion (see assets/rdc/deployment.yaml, which passes
    # .Chart.AppVersion as the default). Leave it empty unless you deliberately want a different
    # rest-dynamic-controller than the oasgen-provider release ships with.
    #
    # This used to be a hand-maintained pin, and the manual step was missed exactly once: chart
    # 0.20.0 shipped tag 0.19.0, a version never published in this org, so every generated
    # controller ImagePullBackOff'd and the visible symptom was an unrelated job hanging several
    # layers away (#62). The two components are released in lockstep at identical versions, so
    # deriving the tag rather than restating it removes the step that can be forgotten.
    #
    # Overriding is still supported and is the documented workaround for a version skew: set this
    # to any published rest-dynamic-controller tag.
    #
    # NOTE: a release still requires the matching RDC tag to EXIST. Alignment removes the
    # "forgot to bump" failure, not the "RDC was not released at this version" one.
    tag: ""
  replicaCount: 1
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # livenessProbe:
  #   httpGet:
  #     path: /
  #     port: http
  # readinessProbe:
  #   httpGet:
  #     path: /
  #     port: http

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # Additional volumes on the output Deployment definition.
  volumes: []

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []

  nodeSelector: {}

  tolerations: []

  affinity: {}

  env: {}
env:
  OASGEN_PROVIDER_DEBUG: "false"
  OASGEN_PROVIDER_MAX_RECONCILE_RATE: 1

# oasgen-render: an in-cluster preview service. POST /render {restDefinitions, oas} returns the CRDs those
# RestDefinitions would generate (same generator as the manager, same image), plus validation findings and
# skipped security schemes, without applying anything. ClusterIP only; it needs no Kubernetes API access.

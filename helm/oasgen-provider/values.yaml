# Default values for oasgen-provider.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

global:
  imageRegistry: ""
image:
  registry: ghcr.io
  repository: krateo-platformops/oasgen-provider
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: "oasgen-provider"
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# livenessProbe:
#   httpGet:
#     path: /
#     port: http
# readinessProbe:
#   httpGet:
#     path: /
#     port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - emptyDir: {}
    name: tmp-dir

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - mountPath: /tmp
    name: tmp-dir

nodeSelector: {}

tolerations: []

affinity: {}

rdc:
  # #379: the hosts a CREDENTIALED request may reach, beyond the ones the OAS document itself names.
  #
  # EMPTY IS THE NO-OP AND THE DEFAULT. An empty list means "no endpoint override is permitted; use the
  # hosts the document names" -- which is where requests already go, so an existing install needs no
  # change and is still fixed. Requiring a value would turn every single-host provider into a config
  # error on upgrade for a capability it does not use.
  #
  # Entries are host[:port], optionally prefixed `http://` (no prefix permits https ONLY -- cleartext
  # has to be asked for), and may use a single leading `*.` wildcard, which matches one or more leading
  # labels and NOT the bare suffix. A bare `*` is rejected at startup; see allowAnyHost below.
  #
  # A PATH IS REFUSED AT STARTUP, with a message saying what to write instead. A path plays no part in
  # matching a host, so pasting a document's `servers[0]` verbatim -- `https://ghe.corp.example.com/api/v3`
  # -- does not belong here; write the host alone. The refusal exists because `example.com/*` used to be
  # accepted as an EXACT entry for example.com: the path was discarded before the `*` checks ran, so the
  # `*` was never seen, and sub.example.com was then refused while this file visibly contained something
  # that looks like it should match (#402). The document's own server URLs are unaffected -- those
  # legitimately carry a path and are read from the document, not from here.
  #
  #   endpointAllowlist:
  #     - ghe.corp.example.com
  #     - ghe.corp.example.com:8443
  #     - "*.ghe.corp.example.com"
  #     - http://legacy.internal.example.com
  #
  # Loopback, link-local, multicast and the unspecified address are refused regardless of this list, and
  # that cannot be overridden from values -- those are the SSRF targets. RFC1918 is deliberately
  # reachable, because an on-prem GHES is routinely private; the control for private space is naming the
  # host here.
  #
  # A DEDICATED KEY rather than rdc.env, deliberately. These would also travel through
  # REST_CONTROLLER_ENDPOINT_ALLOWLIST in rdc.env, and for a security control that is the wrong channel:
  # a misspelled key in a free-form env map silently does nothing, so the operator believes the
  # allowlist is set when it is not. The schema rejects a typo here.
  endpointAllowlist: []

  # The generated controllers' metrics endpoint (#772).
  #
  # 0 DISABLES IT, and that is the shipped default -- unchanged from before this key existed, so nothing
  # about an existing release moves. What changes is that it is now REACHABLE: until #772 the flag
  # defaulted to 0 and nothing in this chart could set it, so the runtime's IncReconcileRequeueAfter and
  # IncReconcileFailure counters were incremented and thrown away on every deployment.
  #
  # WHY IT IS NOT ON BY DEFAULT, stated so the decision is visible rather than inherited: a port on every
  # generated controller is a surface change, and on the one cluster where this was measured NOTHING
  # scrapes them -- the collector declares a `prometheus` receiver that sits in no pipeline, so it never
  # starts. Turning this on by default would open N ports that nothing reads. Set it when you add a scrape.
  #
  # Those two counters are what separate a pass that DEFERRED from one that FAILED -- a distinction that
  # took log arithmetic to recover during a real investigation (#769) and would have been one scrape.
  metrics:
    port: 0

  # The readiness endpoint, and it is ON by default -- which is a deliberate break from `metrics.port: 0`
  # above.
  #
  # WHY ON WHEN THE SIBLING IS OFF. The defect this closes is invisible by construction. A generated
  # controller that cannot acquire its ownership lease reports `avail=1 ready=1 restarts=0 waiting=-`
  # and logs "Waiting for the ownership lease before reconciling" while never logging "Holding the
  # ownership lease; starting workers". A consumer measured that on a real cluster, 6 of 6 controllers,
  # with an in-cluster control -- four pod signals carrying identical values and opposite truths (#815).
  # Nobody opts in to a check for a problem whose every signal reads green, and the consumer who found
  # it did so by reading controller LOGS rather than pod status.
  #
  # SAFE AT THE DEFAULT because `replicaCount` is 1: the sole replica acquires the lease and reports
  # Ready. A replica that STAYS NotReady is one that genuinely cannot reconcile, which is the entire
  # point.
  #
  # READINESS ONLY. Waiting for a lease is HEALTHY -- exactly one replica holds it and the others are
  # correct to wait -- so wiring a LIVENESS probe to this check would restart every waiting replica in a
  # loop, turning a working design into a crash loop. `livenessProbe` is deliberately left empty.
  healthProbePort: 8081

  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    # The first list has to succeed before the check passes, so a few seconds of grace avoids one
    # guaranteed failure at every start.
    initialDelaySeconds: 5
    periodSeconds: 10
    # ~5 minutes before the pod is marked NotReady. GENEROUS ON PURPOSE: a lease handover between
    # replicas, or a slow first list on a large cluster, must not flap the pod. The signal is meant to
    # catch a controller that is PERMANENTLY unable to serve, not one that is briefly behind.
    failureThreshold: 30
    timeoutSeconds: 3

  # Deliberately empty -- see the readinessProbe comment above. A liveness probe pointed at /readyz
  # would restart every replica that is correctly waiting for the ownership lease.
  livenessProbe: {}

  # Disable endpoint matching entirely. The unconditional refusals above still apply.
  #
  # Its own key rather than a `*` entry in the list, so "permit any host" appears in a values diff
  # instead of hiding as punctuation. The controller also logs it loudly once at startup.
  allowAnyHost: false

  # Node-local OTLP endpoint for the C8 audit trail (#253).
  #
  # OFF by default, deliberately. When enabled, the generated controllers get an explicit env block
  # setting OTEL_EXPORTER_OTLP_ENDPOINT to http://$(HOST_IP):<port>, with HOST_IP from
  # status.hostIP -- which is the only way to reach a node-local collector, because the OTLP
  # collector service is headless and has no cluster IP to address.
  #
  # It is gated because an `env:` entry WINS over an `envFrom` one of the same name: with this on,
  # an OTEL_EXPORTER_OTLP_ENDPOINT supplied through rdc.env is silently overridden. Leaving it off
  # means an install that sets its own endpoint keeps it.
  #
  # Setting this alone does not start the audit trail: the controller also needs
  # OTEL_LOGS_ENABLED=true, which travels through rdc.env.
  #
  # THE ENDPOINT SAYS WHERE AND NOTHING ABOUT WHETHER, and there are THREE separate switches, all
  # defaulting to false. This chart documented one of them, which is issue 729: 34 generated
  # controllers on krateo-057 had the endpoint set, every channel off, and exported nothing.
  #
  #   OTEL_ENABLED          OTLP METRICS export
  #   OTEL_TRACING_ENABLED  OTLP TRACE export
  #   OTEL_LOGS_ENABLED     the AUDIT TRAIL (krateo_audit rows)
  #
  # THEY ARE INDEPENDENT, NOT A MASTER AND SUB-SWITCHES, and that is measured rather than inferred:
  # on krateo-057 all 34 rest-dynamic-controller ConfigMaps carry OTEL_LOGS_ENABLED=true with no
  # OTEL_ENABLED key at all, and they export audit rows -- while 76 core-provider ConfigMaps carry
  # OTEL_LOGS_ENABLED=false with OTEL_ENABLED=true and OTEL_TRACING_ENABLED=true. So setting
  # OTEL_ENABLED=true expecting "all telemetry" gets metrics and traces and NO audit trail.
  #
  # All three travel through rdc.env, which is FLEET-WIDE: one map here becomes one ConfigMap per
  # generated controller, re-applied every reconcile, so a change restarts every generated controller.
  # There is no per-kind setting.
  #
  #   rdc:
  #     env:
  #       OTEL_LOGS_ENABLED: "true"      # the audit trail
  #       OTEL_ENABLED: "true"           # metrics
  #       OTEL_TRACING_ENABLED: "true"   # traces
  #
  # Since 0.76.0 the controller logs its own verdict at startup and WARNS on either mismatch: an
  # endpoint with every channel off, or a channel enabled with no endpoint. The second is the worse
  # one -- telemetry is produced and discarded, which a consumer cannot distinguish from no activity.
  otel:
    nodeLocalEndpoint: false
    nodeLocalPort: 4318
  image:
    registry: ghcr.io
    repository: krateo-platformops/rest-dynamic-controller
    pullPolicy: IfNotPresent
    # The RDC tag FOLLOWS THE CHART'S appVersion (see assets/rdc/deployment.yaml, which passes
    # .Chart.AppVersion as the default). Leave it empty unless you deliberately want a different
    # rest-dynamic-controller than the oasgen-provider release ships with.
    #
    # This used to be a hand-maintained pin, and the manual step was missed exactly once: chart
    # 0.20.0 shipped tag 0.19.0, a version never published in this org, so every generated
    # controller ImagePullBackOff'd and the visible symptom was an unrelated job hanging several
    # layers away (#62). The two components are released in lockstep at identical versions, so
    # deriving the tag rather than restating it removes the step that can be forgotten.
    #
    # Overriding is still supported and is the documented workaround for a version skew: set this
    # to any published rest-dynamic-controller tag.
    #
    # NOTE: a release still requires the matching RDC tag to EXIST. Alignment removes the
    # "forgot to bump" failure, not the "RDC was not released at this version" one.
    tag: ""
  replicaCount: 1
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # livenessProbe:
  #   httpGet:
  #     path: /
  #     port: http
  # readinessProbe:
  #   httpGet:
  #     path: /
  #     port: http

  # Additional volumes on the output Deployment definition.
  volumes: []

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []

  nodeSelector: {}

  tolerations: []

  affinity: {}

  # env is handed to EVERY generated rest-dynamic-controller Deployment, so a change here is
  # fleet-wide and restarts every one of them. Pass values with --set-string: a bare --set turns
  # "false" into a bool and a duration into something helm renders differently.
  #
  # REST_CONTROLLER_REQUEST_TIMEOUT bounds an external API request whose call site sets no timeout
  # of its own -- which is every create, update, delete, get, findby and dispatch. Default 30s.
  # The async poll and the lookup runner set their own and are unaffected by it.
  #
  # LOWERING IT IS A TEST INSTRUMENT, NOT A TUNING KNOB. A value below a vendor's write latency makes
  # the controller give up on a request the vendor may already have COMMITTED, which is exactly how a
  # duplicate external resource is produced -- and the whole reason the setting exists is so that state
  # can be measured deliberately on a throwaway cluster instead of waited for in production.
  #
  #   env:
  #     REST_CONTROLLER_REQUEST_TIMEOUT: "30s"
  # DELEGATION (*ApiRef) NEEDS THESE, AND WITH `env` EMPTY IT FAILS AT RECONCILE RATHER THAN AT INSTALL.
  # Any resource declaring observeApiRef / createApiRef / updateApiRef / deleteApiRef reports
  # ReconcileError with "resource declares observeApiRef ... but no snowplow client is configured (set
  # the snowplow/authn URLs)". Measured on a live cluster, verbatim (issue 262).
  #
  #   env:
  #     URL_SNOWPLOW: http://<snowplow-service>.<namespace>.svc:8081
  #     URL_AUTHN:    http://<authn-service>.<namespace>.svc:8082
  #
  # It also needs a projected ServiceAccount token, set through rdc.volumes and rdc.volumeMounts above:
  # a `projected` volume with a `serviceAccountToken` source (audience `authn`, path `token`), mounted
  # read-only at /var/run/secrets/krateo.io/serviceaccount.
  #
  # DO NOT POINT URL_AUTHN AT AUTHN'S `<release>-internal` SERVICE (PORT 8090). It serves only
  # POST /usernames/check, and a NetworkPolicy admits only identity-lifecycle. A URL to it RESOLVES and
  # CONNECTS, then returns 404 or is refused depending on the caller -- so it fails as a wrong answer
  # rather than as a connection error, which is the harder shape to diagnose. Use authn's main Service
  # on 8082.
  #
  # NOT DEFAULTED HERE, DELIBERATELY. The service names and namespace are not knowable from this chart,
  # and a wrong default would point delegation at something that resolves. The Krateo installer supplies
  # them declaratively (installer#578); set them here only for a chart-only install.
  # STRING VALUES ONLY, AND --set WILL NOT DO. values.schema.json declares this map as
  # additionalProperties: {"type": "string"}, and helm's `--set` coerces an unquoted `false`, `true` or a
  # number to its JSON type -- so
  #
  #     --set rdc.env.REST_CONTROLLER_OWNERSHIP=false
  #
  # is REFUSED at install: "at '/rdc/env/REST_CONTROLLER_OWNERSHIP': got boolean, want string". Use
  # `--set-string`, or quote it in a values file.
  #
  # ALREADY IN docs/usage.md -- this is a pointer at the point of use, not a new fact. That page has said
  # "rdc.env values must be set as strings" with both examples since #812, and a consumer still hit it,
  # because the thing that sends you here is not the usage page: rest-dynamic-controller's OWN error
  # messages tell an operator to "disable ownership with REST_CONTROLLER_OWNERSHIP=false", twice, and that
  # advice is right for the binary and incomplete for this chart. Someone acting on a runtime error reads
  # the error, not the install guide.
  #
  # The refusal is the correct behaviour, not a defect: a ConfigMap's `data` values must be strings, so a
  # boolean that got through here would fail later and further away.
  env: {}
env:
  OASGEN_PROVIDER_DEBUG: "false"
  # ON BY DEFAULT (#771), and it is a correctness setting rather than an availability one. Without it
  # EVERY replica reconciles EVERY RestDefinition -- and a RestDefinition reconcile creates CRDs,
  # Deployments, ClusterRoles and ConfigMaps, so two writers means concurrent CRD applies on the same
  # group-resource against an ownership annotation that assumes one writer.
  #
  # A ROLLING UPDATE IS TWO WRITERS BY CONSTRUCTION: the old pod and the new one both reconcile until the
  # old terminates. So this is not an opt-in hazard and the default has to be true.
  #
  # It requires the namespaced Lease grant in templates/role.yaml. Turning this on without that file makes
  # the manager EXIT when it cannot acquire its Lease -- which is why they shipped together.
  OASGEN_PROVIDER_LEADER_ELECTION: "true"
  OASGEN_PROVIDER_MAX_RECONCILE_RATE: 1

# oasgen-render: an in-cluster preview service. POST /render {restDefinitions, oas} returns the CRDs those
# RestDefinitions would generate (same generator as the manager, same image), plus validation findings and
# skipped security schemes, without applying anything. ClusterIP only; it needs no Kubernetes API access.

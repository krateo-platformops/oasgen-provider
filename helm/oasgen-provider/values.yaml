# Default values for oasgen-provider.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

global:
  imageRegistry: ""
image:
  registry: ghcr.io
  repository: krateo-platformops/oasgen-provider
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: "oasgen-provider"
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# livenessProbe:
#   httpGet:
#     path: /
#     port: http
# readinessProbe:
#   httpGet:
#     path: /
#     port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - emptyDir: {}
    name: tmp-dir

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - mountPath: /tmp
    name: tmp-dir

nodeSelector: {}

tolerations: []

affinity: {}

rdc:
  image:
    registry: ghcr.io
    repository: krateo-platformops/rest-dynamic-controller
    pullPolicy: IfNotPresent
    # The RDC tag FOLLOWS THE CHART'S appVersion (see assets/rdc/deployment.yaml, which passes
    # .Chart.AppVersion as the default). Leave it empty unless you deliberately want a different
    # rest-dynamic-controller than the oasgen-provider release ships with.
    #
    # This used to be a hand-maintained pin, and the manual step was missed exactly once: chart
    # 0.20.0 shipped tag 0.19.0, a version never published in this org, so every generated
    # controller ImagePullBackOff'd and the visible symptom was an unrelated job hanging several
    # layers away (#62). The two components are released in lockstep at identical versions, so
    # deriving the tag rather than restating it removes the step that can be forgotten.
    #
    # Overriding is still supported and is the documented workaround for a version skew: set this
    # to any published rest-dynamic-controller tag.
    #
    # NOTE: a release still requires the matching RDC tag to EXIST. Alignment removes the
    # "forgot to bump" failure, not the "RDC was not released at this version" one.
    tag: ""
  replicaCount: 1
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # livenessProbe:
  #   httpGet:
  #     path: /
  #     port: http
  # readinessProbe:
  #   httpGet:
  #     path: /
  #     port: http

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # Additional volumes on the output Deployment definition.
  volumes: []

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []

  nodeSelector: {}

  tolerations: []

  affinity: {}

  env: {}
env:
  OASGEN_PROVIDER_DEBUG: "false"
  OASGEN_PROVIDER_MAX_RECONCILE_RATE: 1

# oasgen-render: an in-cluster preview service. POST /render {restDefinitions, oas} returns the CRDs those
# RestDefinitions would generate (same generator as the manager, same image), plus validation findings and
# skipped security schemes, without applying anything. ClusterIP only; it needs no Kubernetes API access.
render:
  enabled: false
  # fullnameOverride names the render Deployment, Service and selector labels. Empty keeps the generated
  # "<release>-oasgen-provider-render". Set it to place this behind a platform-wide naming convention;
  # the chart deliberately takes no view on what that name should be.
  #
  # A Deployment's spec.selector is IMMUTABLE: setting or changing this on a release that already runs the
  # render pod fails the upgrade with "field is immutable", and the Deployment must be deleted first.
  # Setting it together with enabled=true on a release that never ran it is unaffected.
  fullnameOverride: ""
  replicaCount: 1
  containerPort: 8081
  service:
    port: 80
  podAnnotations: {}
  # Unlike the manager's resources: {} above, the render container ships with a real ceiling, and the
  # asymmetry is deliberate: the manager parses OAS documents the platform put in a ConfigMap, while
  # /render parses whatever any caller in the cluster sends it. Without a limit one pathological document
  # grows until the kubelet evicts its neighbours.
  #
  # The numbers are MEASURED, not guessed. Parsing and rendering holds ~29x the document size as live
  # heap at peak (35 KiB -> 8 MiB, 1.3 MiB -> 46 MiB, 3.1 MiB -> 90 MiB), so the 4 MiB request cap sits at
  # ~116 MiB and 512Mi leaves roughly 4x headroom for concurrent requests and GC slack.
  #
  # COUPLED to OASGEN_RENDER_MAX_BODY_BYTES below: raising one without the other re-creates a service that
  # accepts bodies it cannot render without being OOM-killed.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # snowplowEndpoint creates a Secret whose server-url points at this render Service, so the consumer
  # reads the address from one place instead of having it spelled out in two charts.
  snowplowEndpoint:
    enabled: false
    name: controller-render-endpoint
  # Extra environment, e.g. OASGEN_RENDER_MAX_BODY_BYTES (default 4194304, see DefaultMaxBodyBytes) or
  # OASGEN_RENDER_DEBUG.
  env: {}

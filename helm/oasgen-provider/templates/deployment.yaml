apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oasgen-provider.fullname" . }}
  labels:
    {{- include "oasgen-provider.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "oasgen-provider.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/configmap: {{ printf "%s%s%s%s" (include (print $.Template.BasePath "/configmap.yaml") .) (include (print $.Template.BasePath "/rdc-configmap.yaml") .) (include (print $.Template.BasePath "/rdc-deployment.yaml") .) (include (print $.Template.BasePath "/rdc-rbac.yaml") .) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "oasgen-provider.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "oasgen-provider.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "oasgen-provider.fullname" . }}
          envFrom:
            - configMapRef:
                name: {{ include "oasgen-provider.fullname" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "krateo.image" (dict "img" .Values.image "global" .Values.global "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
          {{- /*
            GATED, because a flag OVERRIDES its own default. main.go reads OASGEN_PROVIDER_DEBUG only
            as the default of the -debug flag, so a bare arg here won unconditionally and the env var
            was dead: values.yaml said "false", docs/configuration.md documented that value, and every
            manager deployed from this chart ran at debug anyway (issue 931). The default below matches
            values.yaml, so the chart obeys its own stated default; a consumer who wants debug logs
            sets env.OASGEN_PROVIDER_DEBUG to the string "true".
          */}}
          {{- if eq (toString (dig "OASGEN_PROVIDER_DEBUG" "false" .Values.env)) "true" }}
          - --debug
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp/assets/rdc-deployment
              name: rdc-deployment
              readOnly: true
            - mountPath: /tmp/assets/rdc-configmap
              name: rdc-configmap
              readOnly: true
            - mountPath: /tmp/assets/rdc-rbac
              name: rdc-rbac
              readOnly: true
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}

      volumes:
        - name: rdc-deployment
          configMap:
            name: {{ include "oasgen-provider.fullname" . }}-rdc-deployment
        - name: rdc-configmap
          configMap:
            name: {{ include "oasgen-provider.fullname" . }}-rdc-configmap
        - name: rdc-rbac
          configMap:
            name: {{ include "oasgen-provider.fullname" . }}-rbac-configmap
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oasgen-provider.fullname" . }}-{{ .Release.Namespace }}
rules:
- apiGroups:
  - ogen.krateo.io
  resources:
  - restdefinitions
  - restdefinitions/status
  verbs:
  - '*'
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - '*'
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - '*'
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  - clusterroles
  - clusterrolebindings
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
  - update
# events.k8s.io is the group modern client-go event broadcasters write to; the legacy core ("") rule
# above does NOT cover it. Without this the broadcaster 403s with "events.events.k8s.io is forbidden"
# and every Kubernetes Event the provider emits is silently dropped (#126).
#
# Not cosmetic: it removed the diagnostics for #122 -- a RestDefinition wedged Ready=False with a CRD
# that was in fact served -- leaving hand-read annotation timestamps as the only surviving evidence.
# rest-dynamic-controller's RBAC already grants this (assets/rdc/rbac/clusterrole.yaml); only the
# provider's own role was missing it.
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - '*'
# Read access to every group so the provider can inspect the CRDs and Custom
# Resources it generates, whose apiGroup is chosen per RestDefinition
# (spec.resourceGroup) and therefore cannot be enumerated here.
#
# `watch` is required, not optional: the provider registers a dynamic watch on each
# generated <Kind>Configuration so a Configuration change re-syncs its auth-secret
# RBAC immediately instead of waiting for the next resync. With get+list only, that
# watch is refused for every generated Kind and the provider logs
#   <kind>configurations.<group> is forbidden: User "system:serviceaccount:..."
#   cannot watch resource "<kind>configurations" ... at the cluster scope
# once per Kind, forever, while the feature silently degrades to resync-only.
- apiGroups:
  - "*"
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch

apiVersion: v2
name: oasgen-provider
description: Krateo PlatformOps OASGen Provider
annotations:
  krateo.io/display-name: OASGen Provider
  krateo.io/category: generator
  krateo.io/maturity: stable
  krateoSupportedVersion: ">= 2.5.1"

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# Minimum Kubernetes version. NOT a routine compatibility bound -- it is a correctness requirement, and
# 1.33 specifically rather than something rounder.
#
# The controller's Observe path merges into whatever status is already stored and never clears it
# (populateStatusFields; clearStatusFields runs on Create/Update, not Observe). A stored status value
# that violates a tightened CRD schema is therefore rewritten unchanged on every reconcile. That is
# harmless ONLY because CRD validation ratcheting makes the API server skip validating a field a write
# leaves unchanged -- without it, every status write is rejected and nothing ever clears the value.
#
# CRDValidationRatcheting: alpha 1.28 (off) -> beta 1.30 (on by default) -> GA 1.33 with
# LockToDefault: true. 1.33 is the first version where a cluster operator CANNOT disable it, which is
# why 1.30 is not sufficient: a 1.30-1.32 cluster with the gate turned off would hit the wedge and
# nothing here could detect that.
#
# The bound costs nothing real: both modules build against client-go v0.35.3 (1.35), so the supported
# skew already implies ~1.34-1.36, and everything excluded here is end-of-life upstream. See
# krateo-platformops/oasgen-provider#152.
kubeVersion: ">=1.33.0-0"

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: CHART_VERSION

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: APP_VERSION
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - oasgen-provider
  - openapi
sources:
  - https://github.com/krateo-platformops/oasgen-provider/tree/APP_VERSION

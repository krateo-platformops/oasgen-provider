apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ "{{" }} .name {{ "}}" }}
  namespace: {{ "{{" }} .namespace {{ "}}" }}
  labels:
    app.kubernetes.io/name: {{ "{{" }} trunc 63 .name {{ "}}" }}
    app.kubernetes.io/instance: {{ "{{" }} trunc 63 .resource {{ "}}" }}
    app.kubernetes.io/version: {{ "{{" }} trunc 63 .apiVersion {{ "}}" }}
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: krateo
    app.kubernetes.io/managed-by: krateo
spec:
  {{- if not .Values.rdc.autoscaling.enabled }}
  replicas: {{ .Values.rdc.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ "{{" }} trunc 63 .name {{ "}}" }}
  template:
    metadata:
      name: {{ "{{" }} .name {{ "}}" }}
      namespace: {{ "{{" }} .namespace {{ "}}" }}
      labels:
        app.kubernetes.io/name: {{ "{{" }} trunc 63 .name {{ "}}" }}
    spec:
      serviceAccountName: {{ "{{" }} .serviceAccountName {{ "}}" }}
      securityContext:
        {{- toYaml .Values.rdc.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ "{{" }} .resource {{ "}}" }}-{{ "{{" }} .apiVersion {{ "}}" }}-controller
          image: {{ include "krateo.image" (dict "img" .Values.rdc.image "global" .Values.global "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.rdc.image.pullPolicy }}
          # THE POD'S OWN IDENTITY, for the Lease this controller holds while reconciling (issue 771).
          #
          # Unconditional, because ownership defaults ON: without these the controller EXITS rather than
          # reconciling without a Lease, since carrying on would be the concurrent-writer state ownership
          # exists to prevent and it would be invisible.
          #
          # The namespace comes from the downward API and NOT from the -namespace flag, which is the
          # WATCHED namespace and empty for a cluster-wide watch.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          {{- if .Values.rdc.otel.nodeLocalEndpoint }}
          # Node-local OTLP endpoint for the C8 audit trail (#253).
          #
          # This has to be an `env:` block rather than a value in the ConfigMap that envFrom reads,
          # because Kubernetes expands $(VAR) ONLY within env entries and only against entries that
          # PRECEDE it in the list. A ConfigMap value containing $(HOST_IP) is delivered literally, so
          # the exporter would try to resolve a host named "$(HOST_IP)" and the audit records would
          # simply never arrive -- with no error from the controller, which does not know where its
          # logs go.
          #
          # Order is therefore load-bearing: HOST_IP must PRECEDE the entry that references it. It is no
          # longer first in the list -- POD_NAME and POD_NAMESPACE are above it -- and that is fine,
          # because neither of those references anything. The rule is about the reference, not the index.
          #
          # Why node-local at all: the OTLP collector service is headless, so there is no cluster IP to
          # send to. status.hostIP gives each pod the node it is running on.
          #
          # An `env:` entry WINS over an `envFrom` entry of the same name, so this would silently
          # override an OTEL_EXPORTER_OTLP_ENDPOINT set through rdc.env -- which is why it is gated off
          # by default rather than always present.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):{{ .Values.rdc.otel.nodeLocalPort }}"
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ "{{" }} .name {{ "}}" }}-configmap
          securityContext:
            {{- toYaml .Values.rdc.securityContext | nindent 12 }}
          args:
            - -group={{ "{{" }} .apiGroup {{ "}}" }}
            - -version={{ "{{" }} .apiVersion {{ "}}" }}
            - -resource={{ "{{" }} .resource {{ "}}" }} 
            # THE LEASE NAME IS GIVEN, NOT DERIVED (issue 771, half two).
            #
            # It is the generated Role's own name, which the provider builds from rbacVersion -- a FIXED
            # v1alpha1, so a CRD version bump does not orphan the previous RBAC set. This Deployment is
            # rendered with the OBSERVED version, so a controller deriving the name from its own -version
            # flag computes a DIFFERENT string from the one its Role grants, cannot acquire, and EXITS.
            # That was a shipped bug for one release, found by a consumer with 32 kinds at v2022-11-28.
            - -lease-name={{ "{{" }} .leaseName {{ "}}" }}
            {{ "{{" }}- if .labelSelector {{ "}}" }}
            # Scopes this controller to the instances its version owns. Every served version runs its own
            # controller and every served endpoint returns every object, so the apiVersion cannot separate
            # them -- the krateo.io/oas-version label does.
            - -label-selector={{ "{{" }} .labelSelector {{ "}}" }}
            {{ "{{" }}- end {{ "}}" }}
            {{/* - -namespace={{ "{{" }} .namespace {{ "}}" }} # Leave empty to watch all namespaces */}}
          ports:
            - name: http
              containerPort: {{ .Values.rdc.service.port }}
              {{- if ne (int .Values.rdc.metrics.port) 0 }}
              # ONLY WHEN NON-ZERO (#772). A containerPort for a server the binary never starts is a
              # declaration a reader, a NetworkPolicy or a scrape config would take at face value -- and
              # REST_CONTROLLER_METRICS_SERVER_PORT: "0" means nothing is listening.
              - name: metrics
                containerPort: {{ .Values.rdc.metrics.port }}
                protocol: TCP
              {{- end }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.rdc.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.rdc.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.rdc.resources | nindent 12 }}
      {{- with .Values.rdc.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
      {{- end }}
      {{- with .Values.rdc.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rdc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rdc.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rdc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
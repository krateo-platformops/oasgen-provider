apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ "{{" }} .name {{ "}}" }}
  namespace: {{ "{{" }} .namespace {{ "}}" }}
  labels:
    app.kubernetes.io/name: {{ "{{" }} trunc 63 .name {{ "}}" }}
    app.kubernetes.io/instance: {{ "{{" }} trunc 63 .resource {{ "}}" }}
    app.kubernetes.io/version: {{ "{{" }} trunc 63 .apiVersion {{ "}}" }}
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: krateo
    app.kubernetes.io/managed-by: krateo
spec:
  {{- if not .Values.rdc.autoscaling.enabled }}
  replicas: {{ .Values.rdc.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ "{{" }} trunc 63 .name {{ "}}" }}
  template:
    metadata:
      name: {{ "{{" }} .name {{ "}}" }}
      namespace: {{ "{{" }} .namespace {{ "}}" }}
      labels:
        app.kubernetes.io/name: {{ "{{" }} trunc 63 .name {{ "}}" }}
    spec:
      serviceAccountName: {{ "{{" }} .serviceAccountName {{ "}}" }}
      securityContext:
        {{- toYaml .Values.rdc.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ "{{" }} .resource {{ "}}" }}-{{ "{{" }} .apiVersion {{ "}}" }}-controller
          image: {{ include "krateo.image" (dict "img" .Values.rdc.image "global" .Values.global "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.rdc.image.pullPolicy }}
          {{- if .Values.rdc.otel.nodeLocalEndpoint }}
          # Node-local OTLP endpoint for the C8 audit trail (#253).
          #
          # This has to be an `env:` block rather than a value in the ConfigMap that envFrom reads,
          # because Kubernetes expands $(VAR) ONLY within env entries and only against entries that
          # PRECEDE it in the list. A ConfigMap value containing $(HOST_IP) is delivered literally, so
          # the exporter would try to resolve a host named "$(HOST_IP)" and the audit records would
          # simply never arrive -- with no error from the controller, which does not know where its
          # logs go.
          #
          # Order is therefore load-bearing: HOST_IP must come first.
          #
          # Why node-local at all: the OTLP collector service is headless, so there is no cluster IP to
          # send to. status.hostIP gives each pod the node it is running on.
          #
          # An `env:` entry WINS over an `envFrom` entry of the same name, so this would silently
          # override an OTEL_EXPORTER_OTLP_ENDPOINT set through rdc.env -- which is why it is gated off
          # by default rather than always present.
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):{{ .Values.rdc.otel.nodeLocalPort }}"
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ "{{" }} .name {{ "}}" }}-configmap
          securityContext:
            {{- toYaml .Values.rdc.securityContext | nindent 12 }}
          args:
            - -group={{ "{{" }} .apiGroup {{ "}}" }}
            - -version={{ "{{" }} .apiVersion {{ "}}" }}
            - -resource={{ "{{" }} .resource {{ "}}" }} 
            {{ "{{" }}- if .labelSelector {{ "}}" }}
            # Scopes this controller to the instances its version owns. Every served version runs its own
            # controller and every served endpoint returns every object, so the apiVersion cannot separate
            # them -- the krateo.io/oas-version label does.
            - -label-selector={{ "{{" }} .labelSelector {{ "}}" }}
            {{ "{{" }}- end {{ "}}" }}
            {{/* - -namespace={{ "{{" }} .namespace {{ "}}" }} # Leave empty to watch all namespaces */}}
          ports:
            - name: http
              containerPort: {{ .Values.rdc.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.rdc.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.rdc.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.rdc.resources | nindent 12 }}
      {{- with .Values.rdc.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
      {{- end }}
      {{- with .Values.rdc.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rdc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rdc.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.rdc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
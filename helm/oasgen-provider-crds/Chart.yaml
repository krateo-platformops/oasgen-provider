apiVersion: v2
name: oasgen-provider-crds
description: Krateo PlatformOps OasGen Provider CRDs

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# Minimum Kubernetes version. NOT a routine compatibility bound -- it is a correctness requirement, and
# two independent ones. 1.36 is the higher of the two, not a rounding.
#
# (1) MutatingAdmissionPolicy, GA and on by default from 1.36. Instances carry krateo.io/oas-version to
# record which served CRD version owns them, and the policy is what writes it at admission. The
# rest-dynamic-controller is started with an exact label selector on that label, so an instance admitted
# WITHOUT it matches no controller's watch: never observed, never reconciled, and healthy-looking. There
# is no fallback -- rest-dynamic-controller used to stamp the label itself, and that path was removed
# precisely because an exact selector means it can never be reached. Symmetric with core-provider, which
# states the same requirement for compositions.
#
# (2) CRD validation ratcheting, GA at 1.33, described below. Still a real requirement; it is simply no
# longer the binding one.
#
# The controller's Observe path merges into whatever status is already stored and never clears it
# (populateStatusFields; clearStatusFields runs on Create/Update, not Observe). A stored status value
# that violates a tightened CRD schema is therefore rewritten unchanged on every reconcile. That is
# harmless ONLY because CRD validation ratcheting makes the API server skip validating a field a write
# leaves unchanged -- without it, every status write is rejected and nothing ever clears the value.
#
# CRDValidationRatcheting: alpha 1.28 (off) -> beta 1.30 (on by default) -> GA 1.33 with
# LockToDefault: true. 1.33 is the first version where a cluster operator CANNOT disable it, which is
# why 1.30 is not sufficient: a 1.30-1.32 cluster with the gate turned off would hit the wedge and
# nothing here could detect that.
#
# Unlike the previous 1.33 bound, this one DOES exclude supported clusters: 1.33, 1.34 and 1.35 are all
# current upstream and can no longer install this chart. That is deliberate. Those versions do not serve
# MutatingAdmissionPolicy, so on them nothing writes krateo.io/oas-version, and the controller's exact
# selector would match nothing -- an install that comes up green and reconciles no instance at all. A
# refused install is the better failure. See krateo-platformops/oasgen-provider#152.
kubeVersion: ">=1.36.0-0"

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
# Versioned with the SAME release tag as the main chart (krateo-oasgen-provider): the CHART_VERSION
# placeholder is substituted to the git tag by release-oci.yaml, so one chart-repo tag publishes the
# app + CRD charts at the same version, and the installer pins both at one version.
#
# Do not replace this with a literal. It was one before (0.0.1, then 0.0.2) — not by choice: the
# provider repo's CRD-sync job used to rewrite any non-semver `version:` to 0.0.1, which silently
# undid this exact line twice. That job now preserves the placeholder
# (krateo-oasgen-provider#39), which is what makes this safe to declare again.
version: CHART_VERSION


home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - oasgen-provider
  - crd
sources:
  - https://github.com/krateo-platformops/oasgen-provider/tree/APP_VERSION

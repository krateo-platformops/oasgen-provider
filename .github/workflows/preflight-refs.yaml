# Resolve every chart and image reference in this repository against its registry, anonymously.
#
# The checker itself now lives in the org-shared reusable. It was a per-repo workflow wrapping a
# 292-line hack/preflight-refs.py, byte-identical in this repo and core-provider -- two copies of the
# same logic, which is where drift starts (#94).
#
# This file keeps only the triggers, because a reusable workflow cannot declare `schedule`, and the
# schedule is not incidental: a package can be deleted or made private long after the last commit, so
# a reference that was valid at merge time can rot with nobody touching the repo.
#
# NOT redundant with chart-images.yaml, which this repo also calls. chart-images LOGS IN to GHCR, so a
# private image is not reported missing when the real problem is permissions; preflight-refs resolves
# ANONYMOUSLY on purpose, because the child cluster's kubelet and core-provider pull without
# credentials -- a chart that resolves for a logged-in maintainer but 404s anonymously is still broken
# in production. Neither subsumes the other; do not delete one as the duplicate.
name: preflight-refs

on:
  pull_request:
  push:
    branches: [main]
  # Registries change under us — a package can be deleted or made private long after the
  # last commit. A weekly run catches that without anyone touching the repo.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    uses: krateo-platformops/.github/.github/workflows/preflight-refs.yaml@main

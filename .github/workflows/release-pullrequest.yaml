name: release-pullrequest

on:
  pull_request:
    branches:
      - main

# oasgen-provider is a Go MONOREPO (go/oasgen-provider + go/rest-dynamic-controller), and every job
# here is the org-shared reusable rather than a local re-implementation:
#
#   lint-docs — shared
#   build     — shared component-image-build (push:false), BOTH module images
#   test      — ./test.yaml, itself a thin caller of the shared component-go-checks, once per module
#
# The hand-rolled `crds-drift` job that used to sit here is gone: the shared reusable exposes the same
# guard as `crd_drift`, which test.yaml sets on the CRD-owning module (#86). The previous header also
# claimed "Only oasgen-provider publishes an image here (rest-dynamic-controller builds from its own
# repo)" -- untrue since #64 folded that build in, and its repo is archived.

jobs:
  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main
    permissions:
      contents: read

  build:
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      modules: '[{"mod":"oasgen-provider","context":"go/oasgen-provider"},{"mod":"rest-dynamic-controller","context":"go/rest-dynamic-controller"}]'
      push: false

  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit

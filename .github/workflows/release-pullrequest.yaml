name: release-pullrequest

on:
  # Deliberately NOT filtered to `branches: [main]`. A stacked PR -- one based on another PR's branch,
  # which is the normal way to split a dependent change into reviewable pieces -- then ran none of the
  # jobs below while STILL showing a green tick, because the only workflow without a base filter is
  # preflight-refs. "1 pass, 0 failures" is what running almost nothing looks like; it is not what
  # passing looks like, and a reviewer doing the right thing got a confirmation meaning the opposite
  # of what it appeared to (#149).
  #
  # The cost is that a stacked PR runs this matrix twice: once against its stack base, and again once
  # GitHub retargets it to main. That is real CI time, and it buys a green tick that means the suite ran.
  pull_request:

# oasgen-provider is a Go MONOREPO (go/oasgen-provider + go/rest-dynamic-controller), and every job
# here is the org-shared reusable rather than a local re-implementation:
#
#   lint-docs — shared
#   build     — shared component-image-build (push:false), BOTH module images
#   test      — ./test.yaml, itself a thin caller of the shared component-go-checks, once per module
#
# The hand-rolled `crds-drift` job that used to sit here is gone: the shared reusable exposes the same
# guard as `crd_drift`, which test.yaml sets on the CRD-owning module (#86). The previous header also
# claimed "Only oasgen-provider publishes an image here (rest-dynamic-controller builds from its own
# repo)" -- untrue since #64 folded that build in, and its repo is archived.

jobs:
  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main
    permissions:
      contents: read

  build:
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      modules: '[{"mod":"oasgen-provider","context":"go/oasgen-provider"},{"mod":"rest-dynamic-controller","context":"go/rest-dynamic-controller"}]'
      # Stamp the build into the binary. Without this every published image reports an empty
      # service.version, the collector falls back to the chart label, and an incident cannot be
      # attributed to a commit (#127). Both Dockerfiles consume BUILD_VERSION via -ldflags.
      build_args: |
        BUILD_VERSION=${{ github.ref_name }}-${{ github.sha }}
      push: false

  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit

# Release workflow for this repo: a plain-semver tag builds and pushes both component images.
#
#   • test  — the suite in test.yaml, across both Go modules. `build` declares `needs: [test]`,
#             which is what makes this a gate: a tag must not publish an image that fails its own
#             tests. That dependency is load-bearing, not decorative — see the note on the job.
#   • build — both multi-platform images (linux/amd64 + linux/arm64) via the shared reusable
#             component-image-build.yaml, tagged from the pushed git tag, as ghcr.io/<owner>/<mod>.
#             The reusable additionally refuses to publish from a tag not contained in main.
#
# The charts are published separately by release-oci.yaml, from the same tag.
#
# This file is NOT identical across component repos, and the previous header's claim that it was
# had stopped being true: the `modules` list below is repo-specific, and core-provider's copy has no
# test job at all. It also documented a third `crds` job that opened a PR into a <repo>-chart repo;
# that job was dropped in #60 when the charts moved into this monorepo, so the comment described a
# publication path that no longer happens — actively misleading when tracing where CRDs go.
name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  # Release gate. Without this a tag published an image that had never run the suite: tests were
  # bound to pull_request only, so anything reaching main outside a PR was released unverified.
  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  build:
    # needs: [test] is what makes the job above an actual gate. Without it GitHub runs the two
    # concurrently and the images publish whatever the suite does -- the guarantee was stated in the
    # comments but never implemented. Observed on the 0.22.0 release: all four jobs started within one
    # second of each other, and the images were built while the tests were still running. They passed,
    # so that release is sound, but it was sound by luck. Images are immutable once pushed and an
    # untested one is indistinguishable from a good one afterwards.
    needs: [test]
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      modules: '[{"mod":"oasgen-provider","context":"go/oasgen-provider"},{"mod":"rest-dynamic-controller","context":"go/rest-dynamic-controller"}]'

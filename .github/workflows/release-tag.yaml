# Release workflow for this repo: a plain-semver tag builds and pushes both component images.
#
#   • test  — the suite in test.yaml, across both Go modules. `build` declares `needs: [test]`,
#             which is what makes this a gate: a tag must not publish an image that fails its own
#             tests. That dependency is load-bearing, not decorative — see the note on the job.
#   • build — both multi-platform images (linux/amd64 + linux/arm64) via the shared reusable
#             component-image-build.yaml, tagged from the pushed git tag, as ghcr.io/<owner>/<mod>.
#             The reusable additionally refuses to publish from a tag not contained in main.
#
# The charts are published separately by release-oci.yaml, from the same tag.
#
# This file is NOT identical across component repos, and the previous header's claim that it was
# had stopped being true: the `modules` list below is repo-specific, and core-provider's copy has no
# test job at all. It also documented a third `crds` job that opened a PR into a <repo>-chart repo;
# that job was dropped in #60 when the charts moved into this monorepo, so the comment described a
# publication path that no longer happens — actively misleading when tracing where CRDs go.
name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  # A PRE-RELEASE IMAGE, SO A CLUSTER RUN CAN PRECEDE A TAG.
  #
  # Until this existed, images came ONLY from a plain-semver tag: release-oci's dispatch publishes CHARTS
  # and points app_version at an image that must already exist, and PR builds never push. So a change
  # whose failure mode is only visible on a cluster could not be validated before shipping -- the gate
  # needed an artifact that only the thing being gated could produce.
  #
  # That bit for real. 0.83.0's Lease work (#771) makes every generated controller acquire a Lease at
  # startup, and controller-runtime EXITS when it cannot -- a crash loop across N kinds per consumer,
  # not a 403 on one call. It was held for a cluster run, three consumers had clusters ready, and there
  # was nothing to install. Diego's decision, 2026-11-17: make the pre-release image possible rather
  # than tag-and-retract or accept render-only verification.
  #
  # THE TAG MUST NOT LOOK LIKE A RELEASE, and guard-prerelease-tag below refuses one that does.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Pre-release image tag, e.g. 0.83.0-rc1. MUST carry a -suffix: a plain semver is a release and belongs on a git tag."
        required: true

jobs:
  # REFUSE A DISPATCH WHOSE TAG LOOKS LIKE A RELEASE, before anything is built.
  #
  # A plain `0.83.0` from a dispatch would be indistinguishable in the registry from a released 0.83.0,
  # would satisfy a consumer's version-line check, and would be invisible to retracted-versions.yaml --
  # which keys on plain semver and is the only control between a cluster and a bad version. A refusal
  # rather than a convention: a convention is a comment nobody reads at the moment they dispatch.
  guard-prerelease-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: The image tag must be a pre-release
        run: |
          tag='${{ github.event.inputs.image_tag }}'
          if printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$'; then
            echo "OK: $tag is a pre-release tag"
            exit 0
          fi
          echo "REFUSED: image_tag '$tag' is not a pre-release." >&2
          echo "A plain semver is a RELEASE and must come from a git tag, so release-oci publishes the" >&2
          echo "charts beside it and retracted-versions.yaml can name it if it turns out bad." >&2
          echo "Use something like 0.83.0-rc1." >&2
          exit 1

  # Release gate. Without this a tag published an image that had never run the suite: tests were
  # bound to pull_request only, so anything reaching main outside a PR was released unverified.
  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  build:
    # needs: [test] is what makes the job above an actual gate. Without it GitHub runs the two
    # concurrently and the images publish whatever the suite does -- the guarantee was stated in the
    # comments but never implemented. Observed on the 0.22.0 release: all four jobs started within one
    # second of each other, and the images were built while the tests were still running. They passed,
    # so that release is sound, but it was sound by luck. Images are immutable once pushed and an
    # untested one is indistinguishable from a good one afterwards.
    # The guard is a needs: too, so a REFUSED dispatch builds nothing. A skipped need counts as
    # satisfied, which is exactly right here: on the tag path guard-prerelease-tag does not run and must
    # not block.
    needs: [test, guard-prerelease-tag]
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      modules: '[{"mod":"oasgen-provider","context":"go/oasgen-provider"},{"mod":"rest-dynamic-controller","context":"go/rest-dynamic-controller"}]'
      # Stamp the build into the binary. Without this every published image reports an empty
      # service.version, the collector falls back to the chart label, and an incident cannot be
      # attributed to a commit (#127). Both Dockerfiles consume BUILD_VERSION via -ldflags.
      # The reusable's input is `version`, NOT `image_tag`. I passed `image_tag` first, having read the
      # local workflow and not the contract it calls: GitHub rejected the whole definition with
      # startup_failure and no jobs, which is the one failure mode that looks like infrastructure rather
      # than like a mistake.
      #
      # Left EMPTY on the tag path, which is the reusable's documented default -- "the tags are derived
      # from the ref as before". Setting it to github.ref_name there would work and would also be a second
      # way to say the same thing, so the empty string keeps one source of truth.
      #
      # github.event.inputs.image_tag is still the DISPATCH's input name, which is this workflow's own and
      # deliberately not renamed: `image_tag` is what an operator is choosing, and `version` is what the
      # reusable calls it.
      version: ${{ github.event.inputs.image_tag || '' }}
      build_args: |
        BUILD_VERSION=${{ github.event.inputs.image_tag || github.ref_name }}-${{ github.sha }}

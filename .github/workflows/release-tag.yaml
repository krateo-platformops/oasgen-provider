# Canonical Krateo COMPONENT (code-repo) release workflow — THE single way every krateo-*
# code repo builds & pushes its image and (if it owns CRDs) publishes them. Identical
# byte-for-byte across ALL component repos (no per-repo config); everything is derived from
# the repo itself.
#
#   • test   — the shared suite in test.yaml, gating everything below it. A tag must not be able
#              to publish an image that fails its own tests.
#   • build  — ONE multi-platform image (linux/amd64 + linux/arm64) via the shared reusable
#              component-image-build.yaml, tagged from the pushed git tag. Image = ghcr.io/<owner>/<mod>.
#   • crds   — only acts for CRD-owning repos: runs `make generate` (the single agnostic entry
#              point each CRD repo exposes; repos without it skip cleanly), then opens a PR into
#              the component's chart repo (krateo-platformops/<repo>-chart) refreshing crds-subchart/
#              (CRDs published WITHOUT resource-policy: keep). The crds-subchart version is left
#              to the chart repo: a `version: CHART_VERSION` placeholder is preserved (that chart
#              ships its CRDs at its own release tag), a literal X.Y.Z is patch-bumped (that chart
#              versions its CRDs on an independent line). Still no per-repo config — the mode is
#              read from the chart repo's Chart.yaml, not configured here.
name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  # Release gate. Without this a tag published an image that had never run the suite: tests were
  # bound to pull_request only, so anything reaching main outside a PR was released unverified.
  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  build:
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      modules: '[{"mod":"oasgen-provider","context":"go/oasgen-provider"},{"mod":"rest-dynamic-controller","context":"go/rest-dynamic-controller"}]'

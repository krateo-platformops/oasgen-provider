# Publishes this repo's Helm charts on a release tag. The workflow itself is the org-wide reusable —
# this file supplies only the triggers, so "identical across every chart repo" is now structural rather
# than a byte-for-byte copy somebody has to keep in step.
#
# The shared workflow gates the publish on every chart-referenced image existing, which is the guard for
# #62 (chart 0.20.0 shipped a rest-dynamic-controller tag that was never published, so every generated
# controller ImagePullBackOff'd).
name: release-oci

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Chart version (CHART_VERSION). Default: the git tag."
        required: false
      app_version:
        description: "App image version (APP_VERSION). Default: latest tag of the app repo."
        required: false

jobs:
  # THE SAME REFUSAL release-tag.yaml CARRIES, AND THIS IS THE MORE DANGEROUS HALF.
  #
  # installer pins CHARTS, and retracted-versions.yaml names CHARTS -- so a plain `0.83.0` chart
  # published from a dispatch would be pinnable, would satisfy the version-line gate, and would be
  # invisible to the one control between a cluster and a bad version. An image at least has to be
  # referenced by a chart to reach anything.
  #
  # Only fires on a dispatch: on the tag path the version IS the git tag, which is a release by
  # definition and already plain semver.
  guard-prerelease-chart:
    # NO JOB-LEVEL `if`, DELIBERATELY. It used to carry
    # `if: github.event_name == 'workflow_dispatch'`, which on a TAG PUSH made this job SKIPPED -- and
    # `release-oci` needs it, so that was skipped too and NO CHART WAS PUBLISHED, behind a run that
    # reported success. 0.83.0 was tagged and produced nothing at all.
    #
    # A skipped `needs` dependency skips the dependent job. No error, no failed check, a tick on the
    # summary. Only a registry probe showed it.
    #
    # So the condition lives INSIDE the step: this job always runs, and on anything but a dispatch it
    # exits 0 having checked nothing.
    #
    # It still runs for EVERY dispatch, including one that leaves chart_version empty. The input's
    # description says the default is "the git tag" -- but a dispatch runs from a BRANCH, where there is
    # no tag to default to, so an empty value on this path is not "use the release version", it is
    # undefined. The regex refuses empty, so letting the guard run is what catches it.
    runs-on: ubuntu-latest
    steps:
      - name: A dispatched chart version must be a pre-release
        run: |
          if [ '${{ github.event_name }}' != 'workflow_dispatch' ]; then
            echo "Not a dispatch (event: ${{ github.event_name }}) -- nothing to guard."
            exit 0
          fi
          v='${{ github.event.inputs.chart_version }}'
          if printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$'; then
            echo "OK: $v is a pre-release chart version"
            exit 0
          fi
          echo "REFUSED: chart_version '$v' is not a pre-release." >&2
          echo "A plain semver chart is a RELEASE: it is pinnable by installer and nameable in" >&2
          echo "retracted-versions.yaml, so it must come from a git tag. Use something like 0.83.0-rc1." >&2
          exit 1

  release-oci:
    needs: [guard-prerelease-chart]
    uses: krateo-platformops/.github/.github/workflows/release-oci.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      chart_version: ${{ github.event.inputs.chart_version || '' }}
      app_version: ${{ github.event.inputs.app_version || '' }}
      # REQUIRED BY THE SHARED REUSABLE, and its absence is a STARTUP FAILURE rather than a job
      # failure: the 0.91.0 tag's release-oci run has 0 jobs and conclusion startup_failure, so no
      # chart was packaged, nothing was pushed, and nothing in this repo's own CI could have caught it
      # -- the caller is syntactically valid and its inputs are only checked against the callee at
      # dispatch time.
      #
      # `none` means these charts are NOT added to a krateo-blueprints index channel, which is what
      # they have always been: a provider's own charts, published to oci://ghcr.io/krateo-platformops/
      # charts and consumed by the installer, not blueprints or pages. core-provider's caller passes
      # the same value, and the reusable's own secret is documented as "required for any index_channel
      # but none" -- which is why this caller passes no secrets and still worked before the input
      # existed.
      #
      # THE REUSABLE IS PINNED TO @main, so its contract can change under a release that changed
      # nothing. This file is byte-identical between 0.90.0 and 0.91.0 and succeeded on the first.
      index_channel: none

# Publishes this repo's Helm charts on a release tag. The workflow itself is the org-wide reusable —
# this file supplies only the triggers, so "identical across every chart repo" is now structural rather
# than a byte-for-byte copy somebody has to keep in step.
#
# The shared workflow gates the publish on every chart-referenced image existing, which is the guard for
# #62 (chart 0.20.0 shipped a rest-dynamic-controller tag that was never published, so every generated
# controller ImagePullBackOff'd).
name: release-oci

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Chart version (CHART_VERSION). Default: the git tag."
        required: false
      app_version:
        description: "App image version (APP_VERSION). Default: latest tag of the app repo."
        required: false

jobs:
  release-oci:
    uses: krateo-platformops/.github/.github/workflows/release-oci.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      chart_version: ${{ github.event.inputs.chart_version || '' }}
      app_version: ${{ github.event.inputs.app_version || '' }}

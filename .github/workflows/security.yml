name: security

on:
  push:
    branches: [main]
  # No base filter: a PR stacked on another branch used to run no scans at all while showing green.
  # See the note in release-pullrequest.yaml and #149.
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  security:
    uses: krateo-platformops/.github/.github/workflows/security.yml@main

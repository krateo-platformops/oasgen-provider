# The Go suite for both modules of this monorepo.
#
# This file holds no test logic. It is a thin caller of the org-shared
# component-go-checks.yaml -- the canonical Go PR checks for every krateo-* Go repo -- once per
# module, which is exactly how core-provider drives its three modules. What used to live here was a
# local re-implementation of that reusable: a hand-rolled matrix plus a separately hand-rolled
# CRD-drift job in release-pullrequest.yaml, both duplicating capabilities the shared workflow already
# exposes as `module`, `test_args` and `crd_drift` (#86).
#
# It remains a workflow of its own, rather than the callers invoking the reusable directly, for two
# reasons:
#
#   * the test_args below are declared ONCE. Three callers -- pull_request, push-to-main, and the
#     release-tag gate -- would otherwise each carry their own copy of the build tags and timeout,
#     which is precisely the drift this change exists to remove;
#   * `push: main` cannot be expressed by a reusable workflow itself, so something in this repo has to
#     own that trigger.
#
# RELEASE GATE: release-tag.yaml calls this and its build job declares `needs: [test]`. That
# dependency is what stops a tag publishing images whose suite failed (#88) -- it was missing until
# then, and the two ran concurrently. Do not remove either half.
name: test

on:
  workflow_call:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # crd_drift runs only here: oasgen-provider owns the RestDefinition CRD, rest-dynamic-controller
  # merely carries a copy of it as an envtest fixture. The shared guard diffs the whole tree, so it
  # covers that fixture and the shipped CRD chart as well as crds/ itself (#84).
  oasgen-provider:
    uses: krateo-platformops/.github/.github/workflows/component-go-checks.yaml@main
    with:
      module: go/oasgen-provider
      crd_drift: true
      test_args: -race -tags=unit,integration -p 1 -coverprofile=coverage.txt -timeout 20m -covermode=atomic ./...
    secrets: inherit

  rest-dynamic-controller:
    uses: krateo-platformops/.github/.github/workflows/component-go-checks.yaml@main
    with:
      module: go/rest-dynamic-controller
      test_args: -race -tags=unit,integration -p 1 -coverprofile=coverage.txt -timeout 20m -covermode=atomic ./...
    secrets: inherit

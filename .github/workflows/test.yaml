# The Go suite for both modules of this monorepo.
#
# This file holds no test logic. It is a thin caller of the org-shared
# component-go-checks.yaml -- the canonical Go PR checks for every krateo-* Go repo -- once per
# module, which is exactly how core-provider drives its three modules. What used to live here was a
# local re-implementation of that reusable: a hand-rolled matrix plus a separately hand-rolled
# CRD-drift job in release-pullrequest.yaml, both duplicating capabilities the shared workflow already
# exposes as `module`, `test_args` and `crd_drift` (#86).
#
# It remains a workflow of its own, rather than the callers invoking the reusable directly, for two
# reasons:
#
#   * the test_args below are declared ONCE. Three callers -- pull_request, push-to-main, and the
#     release-tag gate -- would otherwise each carry their own copy of the build tags and timeout,
#     which is precisely the drift this change exists to remove;
#   * `push: main` cannot be expressed by a reusable workflow itself, so something in this repo has to
#     own that trigger.
#
# RELEASE GATE: release-tag.yaml calls this and its build job declares `needs: [test]`. That
# dependency is what stops a tag publishing images whose suite failed (#88) -- it was missing until
# then, and the two ran concurrently. Do not remove either half.
name: test

on:
  workflow_call:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # crd_drift runs only here: oasgen-provider owns the RestDefinition CRD, rest-dynamic-controller
  # merely carries a copy of it as an envtest fixture. The shared guard diffs the whole tree, so it
  # covers that fixture and the shipped CRD chart as well as crds/ itself (#84).
  oasgen-provider:
    uses: krateo-platformops/.github/.github/workflows/component-go-checks.yaml@main
    with:
      module: go/oasgen-provider
      crd_drift: true
      # Both default to FALSE on the shared reusable, so until now neither has ever run against
      # either module of this monorepo -- and the job is still named "static analysis" and still
      # green, which reads as though they had. An absent check emits nothing to be wrong about.
      # Turned on only after measuring both modules clean, because enabling them dirty converts a
      # latent backlog into a red gate on unrelated PRs, which is what the default-off is for.
      fmt_check: true
      tidy_check: true
      test_args: -race -tags=unit,integration -p 1 -coverprofile=coverage.txt -timeout 20m -covermode=atomic ./...
    secrets: inherit

  # crd_cost_budget runs HERE and not through the shared reusable, because the shared workflow is
  # another repo's and belongs to every component -- adding a setup-envtest step to it would install an
  # apiserver for modules that have no use for one.
  #
  # WHY IT EXISTS. The apiserver estimates the cost of every x-kubernetes-validations rule in a CRD and
  # rejects the whole CRD when the total exceeds its limit. The budget is SCHEMA-WIDE, so rules anywhere
  # in RestDefinition compete, and the cost is anti-correlated with diff size: 0.73.0 spent EIGHT rules
  # while adding no validation of its own, purely by embedding existing types at a new path. A reviewer
  # cannot see that in a diff.
  #
  # Measured independently before this job existed, by installer on a real GKE apiserver and by
  # core-provider under envtest: today's schema admits with roughly 76 rules of headroom. This job keeps
  # it that way, and fails here rather than on someone's cluster roll -- where the rejection names an
  # INNOCENT rule index, because the budget is a total, and therefore reads as a pre-existing CRD
  # problem rather than as the newest addition.
  #
  # TestSchemaRuleLedger runs in the ordinary suite and needs no apiserver; this job adds the only check
  # that can answer whether the CRD actually ADMITS.
  crd_cost_budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/oasgen-provider/go.mod
          cache-dependency-path: go/oasgen-provider/go.sum
      - name: Install setup-envtest and fetch an apiserver
        run: |
          set -euo pipefail
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$("$(go env GOPATH)/bin/setup-envtest" use -p path)" >> "$GITHUB_ENV"
      - name: The generated CRD must admit, and an over-costed copy must not
        working-directory: go/oasgen-provider
        run: |
          set -uo pipefail
          # STREAM THE OUTPUT, DO NOT CAPTURE IT INTO A VARIABLE FIRST.
          #
          # This step's first version ran `out=$(go test ...)` and echoed "$out" afterwards. Under
          # `set -e` the script exits AT THE ASSIGNMENT when the test fails, so the echo never runs and
          # the log showed 70 seconds of silence followed by `exit code 1` -- the diagnostic was on the
          # one path that could not produce it. tee streams it live and keeps a copy for the assertion.
          go test ./apis/restdefinitions/v1alpha1/ -run TestCRDCostBudgetHasHeadroom -count=1 -v 2>&1 | tee /tmp/cost.log
          status=${PIPESTATUS[0]}
          # -run is deliberate: this job exists for one test and the rest of the suite runs above. A
          # `-run` that matches nothing exits 0 with no FAIL lines, so a green exit is not enough --
          # assert the PASS line, which a skip also does not produce.
          if ! grep -q 'PASS: TestCRDCostBudgetHasHeadroom' /tmp/cost.log; then
            echo "::error::the cost-budget test did not PASS (it may have been skipped, or matched nothing). A skip is not a pass."
            exit 1
          fi
          exit "$status"

  rest-dynamic-controller:
    uses: krateo-platformops/.github/.github/workflows/component-go-checks.yaml@main
    with:
      module: go/rest-dynamic-controller
      fmt_check: true
      tidy_check: true
      test_args: -race -tags=unit,integration -p 1 -coverprofile=coverage.txt -timeout 20m -covermode=atomic ./...
    secrets: inherit

# The managed resource + its authentication, applied AFTER the RestDefinition is Ready
# (the Sample/SampleConfiguration CRDs must exist first). Mirrors testdata/rest/.
apiVersion: v1
kind: Secret
metadata:
  name: sample-auth-sec
  namespace: demo-system
type: Opaque
stringData:
  token: test
---
apiVersion: sample.krateo.io/v1alpha1
kind: SampleConfiguration
metadata:
  name: sample-config
  namespace: demo-system
spec:
  authentication:
    bearer:
      tokenRef:
        name: sample-auth-sec
        namespace: demo-system
        key: token
---
# v1-0, not v1alpha1: derived from the OAS document's info.version ("1.0").
apiVersion: sample.krateo.io/v1-0
kind: Sample
metadata:
  name: sample-1
  namespace: demo-system
  annotations:
    # On by default here because watching the HTTP exchange is the point of this example.
    # Safe against the local mock API, and redacted since 0.26.1 (#166) -- but on a
    # provider BELOW 0.26.1 this dump writes `Authorization: Bearer <token>` to the pod
    # log in cleartext, so do not copy it onto a CR holding a real credential there.
    krateo.io/connector-verbose: "true"
spec:
  name: sample-1
  description: Sample resource managed by rest-dynamic-controller
  configurationRef:
    name: sample-config
    namespace: demo-system

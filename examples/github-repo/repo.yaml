# A Repo instance: creates a real repository in the given GitHub org.
# Edit `org` (an org your token can create repos in) before applying.
# v1-1-4, not v1alpha1: derived from the OAS document's info.version ("1.1.4").
apiVersion: github.ogen.krateo.io/v1-1-4
kind: Repo
metadata:
  name: gh-repo-1
  namespace: gh-system
  annotations:
    krateo.io/connector-verbose: "true"
spec:
  configurationRef:
    name: my-repo-config
    namespace: gh-system
  org: my-github-org
  name: krateo-test-repo
  description: A short description of the repository set by Krateo
  visibility: public
  has_issues: true

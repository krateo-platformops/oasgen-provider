# Published versions of this repo's charts that must not be pinned.
#
# A tag cannot be withdrawn: it stays in the registry and looks like any other release. This list is
# how a release is marked bad WHERE A PINNING SESSION WILL SEE IT -- installer's CI reads it and
# refuses a pin on a listed version, so nothing depends on anyone having been told. A "do not pin
# 0.66.0" sentence in a release note is not a control: nothing evaluates it, and the only thing
# between a cluster and a bad version is a human reading prose at the moment of pinning.
#
# `charts` names the CHART, as in the `chart:` field of installer's component-pins.yaml -- NOT the
# component. Those differ for twelve components there (authn-crd/authn-crds,
# frontend-crd/frontend-crds, and ours: component `oasgen-provider-crd` -> chart
# `oasgen-provider-crds`). An entry naming a component is scoped out and retracts NOTHING, silently,
# which is worse than no entry at all. This repo publishes exactly three charts:
#
#     oasgen-provider
#     oasgen-provider-crds
#     controller-render-service
#
# ALL THREE ARE DECLARED MEMBERS OF INSTALLER'S `oasgen` VERSION LINE, and its check-same-version-line
# gate refuses a pin where they are not in step. So a retraction must name all three even when the
# defect lives in one of them: retracting only the provider would leave the matching
# controller-render-service pinnable at the same bad version, with the line gate confirming they are
# "in step".
#
# THE RULE FOR ADDING AN ENTRY: retract what is ACTIVELY HARMFUL, not what is merely superseded. A
# version a consumer legitimately holds today stays available. Installer's gate has no opinion on
# this -- it enforces whatever is listed -- so the judgement is ours and the list must not become a
# way to push upgrades.
#
# AND `use:` MUST ALREADY EXIST when the entry lands. An entry whose replacement is unpublished tells
# a pinning session to stop without telling it where to go.
#
# WHY 0.67.0 AND 0.68.0 ARE NOT LISTED, recorded because their absence is a DECISION and not an
# oversight. Both carry the lost-status-write route into the duplicate -- they have #347's retry branch
# and lack 0.70.0's create-marker guard -- but that is a CODE READING. Nobody has measured a duplicate
# on either: the consumer who predicted it had their 0.68.0 probe come back VOID for a reason unrelated
# to the defect (the apiserver refused their own test CR), and a 0.67.0 run measured the SILENT LATCH
# (one POST, a false Ready=True) rather than a re-create loop.
#
# The rule above says retract what is ACTIVELY HARMFUL and warns the list must not become a way to push
# upgrades. A code-derived route with no measurement is exactly where that bites. If anyone measures a
# duplicate on 0.67.0 or 0.68.0, they belong here on the same day.
#
# WHY 0.77.0 IS LISTED THOUGH NOTHING WAS DAMAGED, recorded because it sits under a different standard
# than the 0.67.0/0.68.0 decision above and a reader comparing them deserves the difference.
#
# That decision refused entries on a CODE READING with no measurement. This one has the measurement --
# two vendors, two sessions, independently -- and what it measured is not damage: no duplicates, no data
# loss, recovery works. The harm is that THE SIGNAL IS GONE. A composition reads healthy indefinitely
# over a resource that will never exist, so nothing ever prompts the human whose intervention is the only
# available recovery.
#
# That is admitted as "actively harmful" deliberately: a failure nobody is told about is worse than a
# visible one, and `CreateOutcomeUnknown` exists for no other purpose than to tell someone. A defect that
# deletes the only prompt for its own recovery is not merely superseded.
#
# AND IT IS NOT A PUSH. 0.77.0 was superseded within hours, two consumers already refuse it on their own
# measurements, and exists.go is byte-identical from 0.78.0 onward -- so nobody holds 0.77.0 for a reason
# the list is taking away.

# Remove an entry only when the version becomes safe again, which for a code defect means never.
#
# WHY `use:` MOVED FROM 0.71.0 TO 0.72.0 on 2026-11-16, recorded because the PREVIOUS value also had
# a reason and a reader deserves both.
#
# The rule is that `use:` names the most-VERIFIED safe version, not the newest. On 2026-11-15 that was
# 0.71.0: it had three consumers' released-artifact verdicts while 0.72.0 had a five-artifact supply
# chain sweep and nothing else. "Published" is not "exercised", and the list must not route anyone onto
# a version whose only evidence is that its images exist.
#
# That premise is now spent. azuredevops-provider-kog ran a full 12-suite regression on 0.72.0 on a real
# cluster -- 194/194 checks, the rdc.env flip rolling 25/25 controllers in BOTH directions, #588 causing
# 0 restarts, teardown verified clean -- plus the write-the-id remediation arm with an untouched control
# proving convergence was attributable to the patch. 0.72.0 is now the better-evidenced of the two, and
# it additionally carries #666 and the 641-line-stale generated reference fix.
#
# WHY `use:` MOVED FROM 0.72.0 TO 0.73.0 on 2026-11-16, a few hours later. The paragraph above predicted
# this move and set the bar for it: "0.73.0 tags shortly and will be unexercised on arrival; it should NOT
# be named here until someone has run it." It has now been run, on four independent arms, so the bar is
# met rather than waived.
#
#   azuredevops-provider-kog  194/194 checks, 12 of 12 suites, on a real cluster, released artifacts
#                             only, 0.72.0 -> 0.73.0 on chart 0.10.0, teardown verified clean.
#                             check-build 25/25 at stamp 0.73.0-f5f438c5; the carry-over CR kept its id;
#                             the rdc.env flip rolled 25/25 in BOTH directions; #593 4/4 at both ends;
#                             5/5 races fired with 0 duplicates (25 races over three releases, 0
#                             duplicates). THIS IS THE COMPARABLE ARM: it is the same suite on the same
#                             cluster shape that gave 0.72.0 its 194/194, which is what makes
#                             "most-verified" a comparison rather than a judgement.
#   github-provider-kog       a live pageNumber walk on kind v1.36.4 against real GitHub: 1 request for
#                             a page-1 match, 2 for a page-2 match (so no over-paging after a match),
#                             the Exhausted arm made exactly 1 POST and GitHub held 106 PRs with no
#                             duplicates, and 0 list GETs across a 263s hold spanning a 180s resync.
#                             Plus a 0.72.0->0.73.0 render diff of 32 kinds at ZERO, with a planted
#                             maxLength as the positive control proving the diff could see a change.
#   openstack-ironic-operator-kog  arm64: pods STARTED and did work from the arm64 images, a generated
#                             controller reconciled a real CR, verifying -> manageable landed, and the
#                             dispatch count was IDENTICAL to 0.61.0 (1 and 1; 2 and 2 on the second
#                             ordering) -- so #710's walk refactor is behaviour-neutral for a findby
#                             kind declaring no pagination, measured on the wire.
#   acmp                      a GKE e2e against a request-logging fake: the walk stops at match_page+1
#                             (1 and 2), Exhausted on all three final-cursor variants, and the
#                             Indeterminate arm files NOTHING and errors loudly.
#
# WHAT THESE RUNS DO NOT ESTABLISH, recorded because "exercised" is not a single claim. All five
# continuationToken walk suites in the regression are SINGLE-PAGE, so they read as "no regression" and
# not as coverage; ironic captured no per-pod imageIDs, so the arm64 binary demonstrably RAN but the
# digest it was selected from is unproven; and no arm covers a last page that is exactly full.
#
# EXPECT THIS TO MOVE AGAIN, on the same terms. The rule is unchanged: `use:` names the most-VERIFIED
# safe version, not the newest, and each repoint is a deliberate act with evidence behind it.
#
# WHY THIS LIST BELONGS TO THIS REPO, in the installer session's words, because they state the
# mechanism better than the mechanism does:
#
#   "An entry's value IS its authority: a publisher vouches for its own releases, and an entry naming a
#    chart outside its set FAILS the gate rather than being obeyed. So a list that can retract anything
#    is a list anyone can use to block anyone."
#
# AND THE HALF A PUBLISHER CANNOT SEE, which is what makes that authority real rather than asserted:
# installer's gate FAILS a pull request whose pin names a chart outside this publisher's declared set.
# So a list that overreaches is REFUSED, not obeyed. The constraint runs both ways and neither end can
# verify it alone -- which is why both files now say it.
#
# WHO ENFORCES THIS LIST, and why that has to be written down. A retraction is only a control where
# something reads it, so this mechanism's coverage is EXACTLY the set of repos that have wired it in --
# and nothing about the mechanism makes that set visible. A version can be retracted here, declared
# correctly, and still shipped, with every gate green everywhere, simply because the shipping repo's CI
# never consults this file.
#
# That is not hypothetical. krateo-blueprints/azuredevops-provider-kog released 0.7.0 pinned to the
# retracted 0.66.0 while this list said not to. Their pin comes straight from a blueprint repo and never
# passes through installer's CI, so the list was never asked. Raised by the installer session, whose
# point was that "the list is only as good as its reach and the reach is currently invisible".
#
# So: keep this current. An entry below is enforced for a consumer ONLY if it appears here.
#
#     krateo-platformops/installer            CI gate, PR #922. Fails CLOSED (rc 2) on an unreadable
#                                             list, because a tolerated 404 reads exactly like every
#                                             pin being clean. Proven to bite with three controls:
#                                             all three charts at 0.66.0 fails, all three at 0.67.0
#                                             passes, and the provider alone at 0.66.0 also fails.
#
#                                             MEASURED REACH, from a run by that session on
#                                             2026-11-16 against main @ 1303873:
#
#                                               scope          EVERY pin and Chart.yaml dependency
#                                                              (91 + 2 = 93 checked)
#                                               sources        7 retraction entries from 3 publishers
#                                               may retract    controller-render-service,
#                                                              oasgen-provider, oasgen-provider-crds
#                                               matched on     the CHART field, not the component name
#                                               triggers       pull_request, push, and nightly
#                                                              19 3 * * *
#                                               reads          this file from THIS repo at a pinned sha
#
#                                             So a `use:` moving here is visible to that gate with no
#                                             change on their side, which is what makes this file a
#                                             control rather than a notification.
#
#                                             AND THE GATE'S OWN BLIND SPOT, in its words: "a repo
#                                             absent from .github/retraction-sources.yaml is not read
#                                             at all, so its retractions are invisible here."
#
#                                             Declared there today, FULLY QUALIFIED because two orgs
#                                             are live and a bare repo name is ambiguous between them:
#
#                                               krateo-platformops/frontend
#                                               krateo-platformops/oasgen-provider
#                                               krateo-platformops/portal
#
#                                             THREE publishers are wired in. For the denominator, that
#                                             session counted by full registry path on 2026-11-16:
#
#                                               oci://ghcr.io/krateo-platformops/charts      50 pins
#                                               oci://ghcr.io/krateo-blueprints/charts       21
#                                               oci://ghcr.io/krateo-agentiko/charts         17
#                                               oci://ghcr.io/krateo-platformops/krateo-saas  1
#                                               oci://ghcr.io/cloudnative-pg/charts           1
#                                               oci://ghcr.io/external-secrets/charts         1
#                                               -> SIX distinct paths across FIVE orgs
#                                                  (krateo-platformops appears at two paths)
#
#                                             So the coverage is three wired publishers against six
#                                             registry paths, rather than unknown. If any unwired
#                                             publisher retracts a version, that gate will not notice.
#
#                                             AND DO NOT QUOTE THAT DENOMINATOR ONWARD WITHOUT
#                                             RE-DERIVING IT. An earlier figure of "seven registries"
#                                             reached this file, attributed and about to become the
#                                             authoritative count for the next reader. Its source was a
#                                             header comment in that repo's own
#                                             check-chart-requires-floors.py, written at some earlier
#                                             state of the pins file, re-derived by nothing, and
#                                             therefore drifting as pins moved. The session caught it
#                                             by running the count and corrected it unprompted; the
#                                             stale comment is being removed there.
#
#                                             A COUNT IN A COMMENT IS WORSE THAN A CLAIM IN A COMMENT,
#                                             because a number is quotable: it travels into other
#                                             people's files, arrives looking measured, and nothing it
#                                             passes through can tell that it was not. Either the gate
#                                             computes the figure or nothing states it.
#
#     WHEN A CONSUMER GATE ACTUALLY READS THIS FILE, in the azuredevops-provider-kog session's own
#     words, because the distinction is theirs and they measured it:
#
#       "A consumer gate reads this file when it RUNS, not when the consumer RELEASES.
#        azuredevops-provider-kog's gate runs in its lint workflow, on PRs and on main; its release
#        workflow only checks that the released commit's lint passed, and does not read this file
#        again. So a version retracted after a commit's lint can still be released from that commit
#        (observed 2026-11-16: chart 0.11.0's lint read this file at 08:42:11Z, #726 changed it at
#        08:47:30Z). The gate also does not read `use:` for a version it lets through; only a refused
#        version's message shows it."
#
#     SO A `use:` MOVING HERE REACHES A GATE ON ITS NEXT RUN, NOT A RELEASE ALREADY PAST LINT. That is
#     a limit of every consumer gate in this section unless it says otherwise, and it is the reason a
#     retraction landing here is not the same event as a consumer being unable to ship the version.
#
#     AND THAT SESSION HAS SINCE CLOSED THEIR HALF OF IT, in their words:
#
#       "Since 2026-11-16 (azuredevops-provider-kog#33) the release workflow re-reads this file against
#        the tagged pin before publishing; it has not yet run on a real release."
#
#     The paragraph above is kept as history rather than rewritten: its timestamps are the OBSERVATION
#     that motivated the fix, and deleting them would leave the fix looking like a precaution. Their
#     preflight refuses a release on a retracted pin (rc 1) or an unreadable list (rc 2), carries lint's
#     two controls, and was tested locally -- the 0.73.0 pin passes, a copy pinned to 0.69.0 is refused
#     with "RETRACTED; use 0.73.0". It runs only on a release tag, so the first real exercise is their
#     next release.
#
#     THE LIMIT STILL APPLIES TO EVERY OTHER CONSUMER IN THIS SECTION. One consumer closing it is not
#     the mechanism changing; it is one row of it.
#
#     AND IT CORRECTS SOMETHING THIS PUBLISHER CLAIMED. I told that session their chart 0.11.0 was
#     "the first pin anywhere to go through a consumer-side gate at a `use:` target that had just
#     moved". It was not: their gate ran five minutes BEFORE #726 merged, and a passing pin never
#     reads `use:` at all, so the claim was impossible rather than merely early. Recorded because the
#     claim was flattering to this file and arrived in writing from its publisher -- which is exactly
#     the kind nobody checks.
#
#     krateo-blueprints/azuredevops-provider-kog
#                                             hack/check-retracted.py, modelled on installer's. Reads
#                                             the pin from $OASGEN_IMAGE, distinguishes rc 1 (refused)
#                                             from rc 2 (unreadable) so an unreadable list can never be
#                                             mistaken for a refusal, and was tested against THIS live
#                                             list rather than a fixture before shipping.
#
# NOT a consumer: krateo-platformops/frontend keeps its own retracted-versions.yaml for its own charts.
# It is a sibling publisher using the same format, not a reader of this file.
#
# AND WHAT THIS PUBLISHER CANNOT SEE EITHER, recorded because the installer session volunteered their
# gap and the symmetrical one is mine. A retraction here is decided from measurements consumers send
# me; I run a five-artifact supply-chain sweep per release and NO cluster probe of any kind. So the
# class of defect that leaves every status green -- a provider that can read but not write, whose
# affected instances cannot carry a condition or an event at all because version-scoped watching
# filters them server-side -- is invisible to my checks AND to installer's roll verification, which
# reads composition conditions and release states. #717 ran for six days and surfaced through an
# event-stream census held by a third session. Neither end of this file would have found it.

retracted:
  - version: "0.83.0"
    charts:
      - oasgen-provider
      - oasgen-provider-crds
      - controller-render-service
    use: "0.83.1"
    reason: >-
      TAGGED AND NEVER PUBLISHED. No image and no chart exists for this version, so it is not
      installable at all -- which makes this entry unusual for this file, and the reason it is here
      anyway is below. A guard job added in #807 carried a job-level `if` restricting it to
      workflow_dispatch, so on a tag push it was SKIPPED; `build` needs it, and a skipped needs
      dependency skips the dependent job, so no image was built. release-oci skipped the same way, so
      no chart. Both runs reported SUCCESS. Fixed in #819 by removing the job-level `if` from both
      guards and deciding inside the step. WHY IT IS LISTED THOUGH A PIN WOULD FAIL LOUDLY -- this
      file is about published versions that must not be pinned, and a pull of 0.83.0 cannot succeed.
      But `git tag` shows 0.83.0 as the newest release and a version-line check has no opinion about
      whether a version EXISTS, so the pin gets attempted and the resulting pull failure reads as a
      registry fault rather than as a version that was never published. This entry turns that into an
      explicit answer. NOT RE-PUSHED -- a tag-push run uses the workflow file at the tag's own commit,
      so recovering 0.83.0 in place would have required moving the tag past #819, and a moved tag
      breaks caches, mirrors and anyone who already fetched. 0.83.1 carries everything 0.83.0 would
      have, plus #819.
  - version: 0.77.0
    charts: [oasgen-provider, oasgen-provider-crds, controller-render-service]
    use: 0.78.0
    reason: >-
      On a findby-addressed kind, a create whose outcome cannot be determined stays
      Ready=False/Creating indefinitely instead of reaching CreateOutcomeUnknown -- and
      core-provider's rollup classifies a Creating child as CONVERGING, so a parent composition reads
      Ready=False/Creating with NO DEADLINE over a resource that will never exist: never green, and
      never failed either. (CORRECTED 2026-11-17: this said "reports healthy", which overstates it.
      core-provider's childhealth_test.go and TestRollup_ConvergingNamesTheChild pin that a
      Ready=False/Creating child holds the parent NOT ready, naming the child. The retraction stands --
      the harm is that "still working on it" is indistinguishable from progress and nothing ever
      escalates -- but the parent does not go green, and a consumer quoted the old wording back to me
      as current.) MEASURED on two vendors by two consumer sessions
      independently: on GitHub (PullRequest, and Collaborator which has no `get` so its existence
      check is always findby) and on Keycloak, each with a manufactured never-landed create and a
      6-minute hold. NO duplicates and NO data loss were observed -- requests stayed flat across
      every hold -- and both recovery arms work. THE SUPPRESSED SIGNAL IS THE HARM: CreateOutcomeUnknown
      exists to prompt a human, and 0.77.0 removed that prompt for exactly the kinds where a lost
      create answer is unrecoverable without one. Consumers counted 15 and 11 findby-addressed kinds
      in their charts. Fixed by #759 in 0.78.0; exists.go is byte-identical from 0.78.0 to 0.80.0.
  - version: 0.70.0
    charts: [oasgen-provider, oasgen-provider-crds, controller-render-service]
    use: 0.73.0
    reason: >-
      A create whose status write loses a race is re-issued on the next reconcile, duplicating the
      external resource, on any kind that declares no `findby` verb. MEASURED on 0.70.0 by two consumers
      independently: a forced-race probe duplicated at the vendor on 3 of 3 trials where the race fired
      (2 unraced trials clean, as controls), and a 303 reproduction on real GitHub produced 3 POSTs in 5
      minutes. The duplicate's route is #347's retry branch, which read `Synced == ReconcileError` -- a
      condition the no-identifier refusal sets by design, so the refusal fed the branch that re-created.
      0.70.0's own #693 DOES hold, including under contention. ONCE A DUPLICATE LANDS NOTHING IN THE CR
      SAYS SO: it reports Ready=True/Available carrying the second object's id, with the first orphaned
      at the vendor, so only a vendor-side count reveals it. 0.71.0 fixes the route (#697) and carries
      0.70.0's own fixes unchanged.
  - version: 0.69.0
    charts: [oasgen-provider, oasgen-provider-crds, controller-render-service]
    use: 0.73.0
    reason: >-
      The same duplicate as 0.70.0 and STRICTLY WORSE: 0.69.0 carries BOTH routes into it. Measured at
      the tags -- 0.69.0 has the no-identifier refusal that feeds #347's retry branch AND lacks the
      create-marker guard that 0.70.0's #693 added, so a lost status write also re-creates through the
      guard that reads conditions a failed status write never persists. A 303 reproduction on real GitHub
      measured 3 POSTs in 5 minutes here as well. Retracting 0.70.0 while leaving this pinnable would
      block the version with one measured route and permit the version with two.
  - version: 0.66.0
    charts: [oasgen-provider, oasgen-provider-crds, controller-render-service]
    # use: WAS 0.67.0, and was correct when written. Repointed to 0.71.0 on 2026-11-15: 0.67.0 is now
    # known to carry the lost-status-write route into the duplicate create (see the scope note above --
    # it is not retracted, because that route is a code reading there and unmeasured). An entry must not
    # route a pinning session onto a version its own publisher knows to be affected, so `use` points at
    # the first version with neither defect. Found by re-reading this file rather than reported.
    use: 0.73.0
    reason: >-
      A kind declaring no `create` verb writes krateo.io/external-create-pending about five times a
      second, for as long as the process lives, and the CR's conditions stay correct throughout so
      nothing in its status shows it (#674). #664 made that path return a non-error result, which lost
      the workqueue's exponential backoff, and the runtime turns a delete of that annotation into an
      immediate Create event -- so each pass scheduled the next. Measured on two consumers
      independently: ~296 passes/minute, and a bisect showing 0.65.0 backing off at 2s, 2s, 4s, 8s,
      16s where 0.66.0 does not back off at all. Every fresh install of a chart whose kind reads a
      resource created alongside it lands here. 0.67.0 is 0.66.0 plus unstructured-runtime v1.17.1,
      which closes the pending marker instead of deleting it; it carries 0.66.0's three fixes
      (#668, #669, #670) unchanged, so there is no reason to pin 0.66.0 once 0.67.0 exists.

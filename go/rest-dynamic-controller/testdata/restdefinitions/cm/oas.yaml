openapi: 3.0.3
info:
  title: Mock Resource API
  version: "1.0"
  description: API for managing mock resources, used for integration testing.
servers:
  - url: http://localhost:30007
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Server health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  time:
                    type: string
                  resources_count:
                    type: integer
                  simulate_errors:
                    type: boolean
                  auth_failures:
                    type: boolean
                  async_operations:
                    type: boolean
                  response_delay:
                    type: string
  /admin/config:
    post:
      summary: Configure server behavior for tests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                simulateErrors:
                  type: boolean
                responseDelayMs:
                  type: integer
                authFailures:
                  type: boolean
                asyncOperations:
                  type: boolean
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  config:
                    type: object
  /resource:
    get:
      summary: List resources
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: false
          description: Filter by resource name
      responses:
        '200':
          description: List of resources
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Resource'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Resource'
                      count:
                        type: integer
        '401':
          description: Unauthorized
        '404':
          description: Resource not found
    post:
      summary: Create a new resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resource'
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '202':
          description: Accepted (async operation)
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId:
                    type: string
                  status:
                    type: string
                  resource:
                    $ref: '#/components/schemas/Resource'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '409':
          description: Resource already exists
  /resource/{id}:
    get:
      summary: Get a resource by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resource found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '401':
          description: Unauthorized
        '404':
          description: Resource not found
    put:
      summary: Update a resource by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resource'
      responses:
        '200':
          description: Resource updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '202':
          description: Accepted (async operation)
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId:
                    type: string
                  status:
                    type: string
                  resource:
                    $ref: '#/components/schemas/Resource'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Resource not found
    patch:
      summary: Patch a resource by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Resource patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Resource not found
    delete:
      summary: Delete a resource by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Resource deleted
        '202':
          description: Accepted (async operation)
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId:
                    type: string
                  status:
                    type: string
        '401':
          description: Unauthorized
        '404':
          description: Resource not found
  /status/{code}:
    get:
      summary: Return a specific HTTP status code for testing
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: integer
      responses:
        'default':
          description: Custom status code response
          content:
            application/json:
              schema:
                type: object
  # --- dispatch (fire-and-correlate) ---
  #
  # Modelled on GitHub Actions workflow_dispatch, the shape the dispatch verb exists for. The trigger
  # answers 204 with NO body and no identifier, so the only way back to the invocation it started is
  # the correlation token -- which this API, like GitHub, does NOT echo onto the run. The token
  # reaches the run through display_title, because the workflow sets run-name from its own input.
  /workflows/{workflowId}/dispatches:
    post:
      summary: Trigger a workflow run
      operationId: dispatchWorkflow
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ref:
                  type: string
                  description: The git ref to run against.
                inputs:
                  type: object
                  description: >
                    Workflow inputs. correlationId is declared BY NAME rather than left free-form:
                    the token has to exist in the generated spec schema for an author to be able to
                    set it, which is the same reason the shipped github-workflow-dispatch example
                    declares it explicitly.
                  properties:
                    correlationId:
                      type: string
      responses:
        '204':
          description: Trigger accepted. No body, and nothing identifying the run it started.
  /workflows/{workflowId}/runs:
    get:
      summary: List workflow runs
      operationId: listWorkflowRuns
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The runs of this workflow, in GitHub's envelope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type: integer
                  workflow_runs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        status:
                          type: string
                        conclusion:
                          type: string
                        display_title:
                          type: string
                          description: Where the correlation token actually arrives.
                        html_url:
                          type: string
                        created_at:
                          type: string
  # --- async operations ---
  #
  # The 202-with-a-handle shape the async engine exists for: the create reports that an operation
  # started, not what it produced, so the controller must poll the operation and only then read the
  # resource. Before this the engine had no integration coverage at all -- no testdata declared `async:`.
  /async/resource:
    post:
      summary: Create a resource asynchronously
      operationId: asyncCreateResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
              required:
                - name
      responses:
        '202':
          description: >
            Operation accepted. Carries the operation handle and the id the API allocated -- not the
            resource itself, which is not provisioned yet. The id is what makes a postGet keyed by a
            server-assigned identifier possible: it is projected into status from this response (#229).
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId:
                    type: string
                  id:
                    type: string
  /operations/{operationId}:
    get:
      summary: Status of an asynchronous operation
      operationId: getOperationStatus
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The operation's current status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId:
                    type: string
                  status:
                    type: string
  # --- dependent lookups (#120) -------------------------------------------------------------------------
  # Two shapes, because two consumers define the feature: a CHAIN (project -> default profile -> that
  # profile's token) and a MATCH over a list (the flow whose alias equals a CR field).
  /lookup/projects/{projectId}:
    get:
      summary: First link of the chain - the project's default profile name.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: the project
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  defaultProfile: {type: string}
  # The {profileRef} value is "profiles/main", not "main" -- mirroring GitHub's single {ref} parameter
  # whose value must be formatted "heads/<branch>". That is what makes the chained value need a
  # valueMapping to be addressable, and testing the easy shape instead would never exercise the transform.
  /lookup/profiles/{profileRef}:
    get:
      summary: Second link - the token of the profile the first link named.
      parameters:
        - name: profileRef
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: the profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
                  token:
                    type: object
                    properties:
                      value: {type: string}
  /lookup/flows:
    get:
      summary: A BARE ARRAY of flows, which is why LookupMatch.itemsAt defaults to ".".
      responses:
        '200':
          description: the flows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    alias: {type: string}
                    id: {type: string}
  /lookup/refs:
    post:
      summary: Create a ref, carrying the values the lookups resolved.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Ref'}
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ref'}
  /lookup/refs/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: the ref
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ref'}
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: deleted

components:
  schemas:
    Ref:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        # projectId and flowAlias are in the BODY so generation puts them in spec, which is what the
        # lookups read with inCustomResource. That mirrors the real consumers: GitRef's lookups read
        # spec.owner/spec.repo and KeycloakClient's reads spec.realm, and in both cases those are already
        # path parameters of the create verb. A lookup can only read a field something else puts in spec.
        projectId: {type: string}
        flowAlias: {type: string}
        # sha is resolved by the chain UNLESS the CR supplies it, which is what the `when` guard decides.
        sha: {type: string}
        # flow is always resolved by the match; a CR never sets it.
        flow: {type: string}
      required: [name]
    Resource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
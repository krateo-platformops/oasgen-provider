kind: RestDefinition
apiVersion: ogen.krateo.io/v1alpha1
metadata:
  name: def-pipelinepermissions
  namespace: default
spec:
  
  oasPath: https://raw.githubusercontent.com/krateoplatformops/azuredevops-oas3/refs/heads/1-webservices/approvalandchecks/pipelinepermissions.yaml
  resourceGroup: azure.devops.com
  resource: 
    kind: PipelinePermission
    identifiers:
      - resourceType
      - resourceId
    verbsDescription:
    - action: findby
      method: POST
      # identifiersMatchPolicy is stated rather than left to default, and OR is correct HERE
      # for a reason that does NOT travel: this path names a single object, so the response is
      # one item and there is nothing else to adopt. Over a COLLECTION, OR adopts the first
      # item matching ANY ONE identifier -- which can be a different object than the resource
      # names, and the reconciler then treats it as this resource, deletions included. If you
      # copy this verb to a findby that returns a list, set AND.
      identifiersMatchPolicy: OR
      path: /ws/{organization}/{project}/_apis/pipelines/pipelinepermissions/{resourceType}/{resourceId}
    - action: get
      method: POST
      path: /ws/{organization}/{project}/_apis/pipelines/pipelinepermissions/{resourceType}/{resourceId}
    - action: update
      method: PATCH
      path: /{organization}/{project}/_apis/pipelines/pipelinepermissions/{resourceType}/{resourceId}
    - action: create
      method: PATCH
      path: /{organization}/{project}/_apis/pipelines/pipelinepermissions/{resourceType}/{resourceId}


  